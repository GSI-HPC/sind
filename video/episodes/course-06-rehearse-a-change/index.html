<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind course 06: Rehearse a change</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

  /* Release lines and their image tags, as in the docs table. */
  .rtable { position: absolute; left: 120px; top: 290px; width: 1040px; display: flex; flex-direction: column; gap: 14px; }
  .rt-row { display: grid; grid-template-columns: 330px 1fr; align-items: center; padding: 16px 28px; border-radius: 18px; background: rgba(30, 41, 59, 0.75); border: 2px solid var(--av-color-border); }
  .rt-head { background: none; border-color: rgba(0, 0, 0, 0); padding-top: 0; padding-bottom: 0; font-size: 24px; font-weight: 700; color: var(--av-color-text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .rt-line { font-family: "JetBrains Mono", monospace; font-size: 40px; font-weight: 700; color: #fff; }
  .rt-tags { display: flex; gap: 16px; }
  .tag { padding: 6px 18px; border-radius: 12px; background: #1e293b; border: 2px solid var(--av-color-border); font-family: "JetBrains Mono", monospace; font-size: 32px; color: var(--av-color-text); }
  .rt-note { position: absolute; left: 120px; top: 640px; font-size: 30px; color: var(--av-color-text-muted); }
  .rt-note b { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--av-color-accent-soft); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Course 06, Rehearse a change: docs/content/course/06-rehearse-a-change.md.
  // Every command, output, config and generated file on screen is copied from
  // the reference pages, and the course page's Commands section repeats them:
  //   docs/content/architecture/slurm-config.md      slurm.conf, sind-nodes.conf
  //   docs/content/configuration/cluster-config.md   the slurm section (map form)
  //   docs/content/container-images/building-images.md  release lines, tags, defaults.image
  //   docs/content/usage/diagnostics.md              sind -vv create cluster --config cluster.yaml
  //   docs/content/usage/cluster-lifecycle.md        sind delete cluster dev
  // Files are code scenes, which check checks against those pages; the
  // release-line table stays a custom scene, as the code scene shows files only.
  const SERIES = "Course 06";
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const el = (html) => Object.assign(document.createElement("template"), { innerHTML: html.trim() }).content.firstElementChild;

  // A custom slide: background, chapter label and title, Sindy in the corner.
  function frame(ep, kind, o) {
    const s = ep.custom(kind, { chapter: o.chapter, shot: "cornerR" });
    const chapter = `<div class="chapter"><span class="dot"></span>${SERIES}<b> · ${esc(o.label || o.chapter)}</b></div>`;
    s.el.append(el('<div class="bg-glow"></div>'), el(chapter), el(`<div class="slide-title">${esc(o.title)}</div>`));
    Scenes.enter(ep.tl, s.el.querySelector(".slide-title"), s.t + 0.5);
    return s;
  }
  // Tween from style `a` to `b` at `at`, and back at `until` if given.
  function swap(tl, els, a, b, at, until) {
    tl.fromTo(els, a, Object.assign({ duration: 0.3 }, b), at);
    if (until != null) tl.fromTo(els, b, Object.assign({ duration: 0.3, immediateRender: false }, a), until);
  }

  // docs/content/architecture/slurm-config.md: the baseline for `sind create cluster dev`.
  const SLURM_CONF = ["# Generated by sind", "ClusterName=dev", "SlurmctldHost=controller", "SlurmUser=slurm",
    "StateSaveLocation=/var/spool/slurmctld", "SlurmdSpoolDir=/var/spool/slurmd", "PlugStackConfig=/etc/slurm/plugstack.conf", "",
    "ProctrackType=proctrack/cgroup", "TaskPlugin=task/cgroup", "MpiDefault=pmix", "ReturnToService=2", "DefMemPerCPU=512", "",
    "include /etc/slurm/sind-nodes.conf"].join("\n");
  // Same page: sind-nodes.conf for three workers with cpus: 2 and memory: 1g.
  const NODES_CONF = ["# Generated by sind",
    "NodeName=worker-0 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "NodeName=worker-1 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "NodeName=worker-2 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "PartitionName=all Nodes=worker-0,worker-1,worker-2 Default=YES"].join("\n");
  // docs/content/configuration/cluster-config.md, Slurm section, map form.
  const SLURM_YAML = ["slurm:", "  main:",
    "    scheduling: |", "      SchedulerType=sched/backfill", "      SchedulerParameters=bf_continue",
    "    resources: |", "      SelectType=select/cons_tres"].join("\n");
  // Lines `a` to `b` of a code panel, marked together.
  const block = (a, b, at, until) => Array.from({ length: b - a + 1 }, (_, i) => ({ line: a + i, at, until }));

  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "course-06-rehearse-a-change", title: "06 · Rehearse a change", series: SERIES })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "The sind course · 06", title: "Rehearse a change", say: "intro" })
    .talk({
      chapter: "Why rehearse?",
      kicker: "Testing site changes",
      title: "Before production gets it",
      sub: "A scheduler setting or a new Slurm release, tried on a cluster you throw away.",
      chips: ["slurm.conf", "Release lines", "Version check"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [{ id: "hook", mood: "thinking", cues: { Production: "concerned" } }, { id: "needs", mood: "happy" }],
    })
    .slide({
      chapter: "The scenario",
      title: "Your rehearsal",
      say: [{ id: "case", mood: "neutral" }, { id: "case2", mood: "neutral" }, { id: "case3", mood: "neutral", cues: { laptop: "happy" } }],
      bullets: [
        { icon: "gear", title: "A new scheduler setting", text: "to try in slurm.conf first", at: "case:scheduler" },
        { icon: "server", title: "Two Slurm release lines", text: "the one production runs, and the next", at: "case2:release" },
        { icon: "host", title: "A cluster on your laptop", text: "built from a config file, thrown away after", at: "case3:laptop" },
      ],
    })
    // slurm.conf includes sind-nodes.conf: the include line lights up and a
    // note names the file it pulls in.
    .code({
      chapter: "Refresher: slurm.conf on one screen",
      label: "Refresher · slurm.conf on one screen",
      wide: true,
      say: [{ id: "ref1", mood: "neutral" }, { id: "ref2", mood: "neutral" },
        { id: "ref3", mood: "neutral", cues: { own: "happy" } }, { id: "ref4", mood: "neutral", cues: { alone: "smug" } }],
      panels: [
        { file: "slurm.conf", lang: "conf", text: SLURM_CONF },
        { file: "sind-nodes.conf", lang: "conf", text: NODES_CONF },
      ],
      reveal: [{ panel: 1, lines: [1, 5], at: "ref2:NodeName" }],
      marks: [
        { panel: 0, text: "SlurmctldHost", at: "ref2:SlurmctldHost", until: "ref2:NodeName" },
        { panel: 1, text: "NodeName=", at: "ref2:NodeName", until: "ref2:partition" },
        { panel: 1, text: "PartitionName=", at: "ref2:partition", until: "ref3:include" },
        { panel: 0, text: "include", at: "ref3:include" },
        { panel: 1, text: "Name=", at: "ref4:rewrites", until: "ref4:alone" },
      ],
      notes: [
        { icon: "job", text: "include pulls sind-nodes.conf into slurm.conf", at: "ref3:pulls" },
        { icon: "nodes", text: "sind rewrites sind-nodes.conf when workers come and go", at: "ref4:rewrites" },
      ],
    })
    .code({
      chapter: "Try a scheduler setting",
      title: "Try a scheduler setting",
      say: [{ id: "setting", mood: "neutral" }, { id: "fragments", mood: "neutral", cues: { scheduling: "happy" } }],
      file: "cluster.yaml · slurm section",
      lang: "yaml",
      text: SLURM_YAML,
      marks: [
        { text: "slurm:", at: "setting:section", until: "setting:main" },
        { text: "main:", at: "setting:main", until: "fragments:map" },
        { text: "scheduling:", at: "fragments:map" },
        { text: "resources:", at: "fragments:map", until: "fragments:scheduling" },
        { text: "Scheduler", at: "fragments:scheduling" },
      ],
      notes: [
        { icon: "job", text: "sind creates slurm.conf.d/scheduling.conf", at: "fragments:fragment" },
        { icon: "job", text: "and slurm.conf.d/resources.conf", at: "fragments:fragment+0.3" },
      ],
    })
    // Where main lands: the include of sind-nodes.conf lights up, then the
    // fixed block and the block of defaults.
    .code({
      chapter: "Where it lands",
      say: [{ id: "lands", mood: "neutral" }, { id: "fixed", mood: "thinking" },
        { id: "replace", mood: "neutral", cues: { replaces: "smug" } }, { id: "once", mood: "thinking", cues: { try: "neutral" } }],
      file: "slurm.conf",
      lang: "conf",
      text: SLURM_CONF,
      marks: [
        { text: "include", at: "lands:include#1", until: "fixed:fixed" },
        ...block(2, 7, "fixed:fixed", "replace:default"),
        ...block(9, 13, "replace:default", "once:once"),
      ],
      notes: [
        { icon: "gear", text: "main: an include line per fragment, just above the last line", at: "lands:before" },
        { warn: true, text: "sind writes slurm.conf once, at creation", at: "once:once" },
      ],
    });

  // ---- Pick a Slurm release: the release-line table of the docs ----
  {
    const s = frame(ep, "release", { chapter: "Pick a Slurm release", title: "One image per release line" });
    // docs/content/container-images/building-images.md, Official images.
    const table = el(`<div class="rtable"><div class="rt-row rt-head"><div>Slurm release line</div><div>Image tags</div></div>
      <div class="rt-row"><div class="rt-line">26.05</div><div class="rt-tags"><span class="tag">latest</span><span class="tag mm">26.05</span><span class="tag pin">26.05.4</span></div></div>
      <div class="rt-row"><div class="rt-line">25.11</div><div class="rt-tags"><span class="tag mm">25.11</span><span class="tag pin">25.11.8</span></div></div></div>`);
    const note = el('<div class="rt-note">image <b>ghcr.io/gsi-hpc/sind-node</b></div>');
    s.el.append(table, note);
    ep.P.wait(0.6);
    ep.say([{ id: "images", mood: "neutral" }, { id: "tags", mood: "neutral" }]);
    const T = ep.time;
    const TAG = [{ backgroundColor: "#1e293b", borderColor: "#334155", color: "#e2e8f0" }, { backgroundColor: "#5eead4", borderColor: "#5eead4", color: "#0b1220" }];
    Scenes.enter(tl, table.children, T("images:image") - 0.2, { stagger: 0.15 });
    Scenes.enter(tl, note, T("images:supported"), { y: 16 });
    ep.glance(T("images:image"), 0.9, -0.7, -0.1);
    swap(tl, table.querySelectorAll(".mm"), ...TAG, T("tags:year"), T("tags:number"));
    swap(tl, table.querySelectorAll(".pin"), ...TAG, T("tags:number"));
    ep.glance(T("tags:number"), 0.8, -0.4, -0.1);
  }

  ep.code({
    label: "Pick a Slurm release",
    title: "Set the release line",
    say: [{ id: "defaults", mood: "happy" }, { id: "next", mood: "smug" }],
    file: "cluster.yaml · defaults",
    lang: "yaml",
    text: "defaults:\n  image: ghcr.io/gsi-hpc/sind-node:25.11",
    marks: [{ text: "image:", at: "defaults:default", until: "next:newer" }],
    notes: [
      { icon: "server", text: "25.11, the release line production runs", at: "defaults:production" },
      { icon: "docker", text: "next release: the 26.05 tag, and a new cluster", at: "next:newer" },
    ],
  });

  ep.terminal({
    chapter: "Create the rehearsal",
    say: [
      { id: "create", mood: "happy" },
      { id: "logs", mood: "neutral", cues: { version: "joy" } },
      { id: "debug", mood: "neutral" },
      { id: "done", mood: "happy" },
      { id: "delete", mood: "smug" },
    ],
    steps: [
      { cmd: "sind -vv create cluster --config cluster.yaml", at: "create:Run" },
      { out: "00:13:28.438 INFO ensuring mesh infrastructure realm=sind", at: "create:double" },
      { out: "00:13:28.826 INFO creating cluster name=dev nodes=3", after: 0.4 },
      { out: "00:13:29.382 INFO resolved infrastructure slurm=25.11.8", after: 0.5 },
      { out: "00:13:30.621 DEBU waiting for node node=controller", after: 0.5 },
      { out: "00:13:30.622 DEBU waiting for node node=worker-0", after: 0.2 },
      { out: "00:13:31.474 INFO nodes ready count=3", after: 0.8 },
      { out: "00:13:32.362 DEBU enabling slurm service node=controller service=slurmctld", after: 0.6 },
      { out: "00:13:32.363 DEBU enabling slurm service node=worker-0 service=slurmd", after: 0.2 },
      { out: "00:13:32.608 INFO slurm services enabled", after: 0.5 },
      { mark: "name=dev", at: "logs:name", until: "logs:version" },
      { mark: "slurm=25.11.8", at: "logs:version", until: "debug:debug" },
      { mark: "waiting for node", at: "debug:waiting", until: "debug:enabling" },
      { mark: "enabling slurm service", at: "debug:enabling", until: "delete:When" },
      { cmd: "sind delete cluster dev", at: "delete:sind" },
      { prompt: true, after: 0.8 },
    ],
  });

  ep.diagram({
    chapter: "Under the hood",
    title: "How sind finds the Slurm version",
    say: [{ id: "discover", mood: "neutral" }, { id: "label", mood: "neutral" }, { id: "guard", mood: "neutral", cues: { refuses: "concerned" } }],
    grid: [3, 2],
    nodes: [
      { id: "img", title: "Node image", text: "sind-node:25.11", code: true, icon: "docker", width: 320, pos: [0, 0], at: "discover:image" },
      { id: "probe", title: "slurmctld -V", text: "throwaway container", icon: "terminal", width: 340, pos: [1, 0], at: "discover:throwaway" },
      { id: "label", title: "Node label", text: "sind.slurm.version", code: true, icon: "gear", width: 340, pos: [2, 0], at: "label:label" },
      { id: "column", title: "SLURM column", text: "sind get clusters", code: true, icon: "check", width: 340, pos: [2, 1], at: "label:column" },
      { id: "worker", title: "New workers", text: "with another image", icon: "nodes", width: 340, ghost: true, pos: [1, 1], at: "guard:workers" },
    ],
    edges: [
      { from: "img", to: "probe", at: "discover:asks" },
      { from: "probe", to: "label", at: "label:label+0.3" },
      { from: "label", to: "column", at: "label:shows" },
      { from: "worker", to: "label", label: "same version only", dashed: true, accent: true, at: "guard:refuses" },
    ],
  });

  ep.slide({
    chapter: "Takeaways",
    title: "Takeaways",
    say: { id: "takeaway", mood: "happy" },
    bullets: [
      { icon: "gear", title: "The slurm section carries the change", text: "main lands before the include of sind-nodes.conf", at: "takeaway:section" },
      { icon: "docker", title: "The image tag picks the release", text: "one official image per Slurm release line", at: "takeaway:tag" },
      { icon: "check", title: "Delete it when you're done", text: "sind delete cluster, then rehearse again", at: "takeaway:delete" },
    ],
  });

  ep.outro({ chapter: "Wrap-up", next: "07 · Failure drills", say: "outro" }).done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
