<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind course 02: Your first cluster</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Course 02: docs/content/course/02-first-cluster.md (its Commands section
  // holds every command and output shown here). Terminal content is copied
  // from docs/content/getting-started/installation.md (download, verify,
  // install), docs/content/usage/diagnostics.md (sind doctor and its output),
  // docs/content/getting-started/quickstart.md (create, get, job script,
  // sbatch, output, delete) and docs/content/usage/node-access.md (sind ssh).
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "course-02-first-cluster", title: "02 · Your first cluster", series: "Course 02" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "The sind course · 02", title: "Your first cluster", say: "intro" })
    .talk({
      chapter: "From zero to a job",
      kicker: "A first job",
      title: "A new batch script. Where can it run today?",
      sub: "Install sind, check the host, create a cluster and run the job, all on your own machine.",
      chips: ["Linux + Docker", "One binary", "No sudo for sind"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [
        { id: "hook", mood: "thinking", cues: { watch: "happy" } },
        { id: "need", mood: "neutral", cues: { single: "happy" } },
      ],
    })
    .slide({
      chapter: "The plan",
      title: "The plan",
      say: { id: "plan", mood: "happy" },
      bullets: [
        { icon: "terminal", title: "Install sind", text: "download, verify, install", at: "plan:install" },
        { icon: "check", title: "Check the host", text: "sind doctor", at: "plan:doctor" },
        { icon: "job", title: "Create a cluster, submit a job", text: "sind create cluster, sbatch", at: "plan:create" },
        { icon: "key", title: "SSH in and clean up", text: "sind ssh, sind delete cluster", at: "plan:SSH" },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Install sind",
      say: [
        { id: "dl", mood: "neutral" },
        { id: "verify", mood: "neutral", cues: { made: "smug" } },
        { id: "install", mood: "happy", gap: 0.5 },
      ],
      steps: [
        { cmd: "curl -fLO https://github.com/GSI-HPC/sind/releases/latest/download/sind-linux-amd64", at: "dl:download" },
        { cmd: "gh attestation verify sind-linux-amd64 --repo GSI-HPC/sind \\\n  --signer-workflow GSI-HPC/sind/.github/workflows/release.yml", at: "verify:GitHub" },
        { cmd: "install -D ./sind-linux-amd64 ~/.local/bin/sind", at: "install:install" },
        { prompt: true, after: 0.9 },
      ],
    })
    .slide({
      chapter: "Other ways to install",
      title: "Install it your way",
      say: [
        { id: "path", mood: "thinking", cues: { login: "neutral" } },
        { id: "alt", mood: "neutral", cues: { both: "happy" } },
      ],
      bullets: [
        { icon: "user", title: "Per user, in ~/.local/bin", text: "log out and back in if the directory is new", at: "path:log#0" },
        { icon: "gear", title: "With a tool manager", text: "mise installs and verifies the release binary", at: "alt:tool" },
        { icon: "terminal", title: "From source", text: "go install builds it with your Go toolchain", at: "alt:source" },
      ],
    })
    .terminal({
      chapter: "Check the host",
      say: [
        { id: "doctor", mood: "neutral" },
        { id: "doctorok", mood: "happy", cues: { good: "joy", fails: "neutral" } },
      ],
      steps: [
        { cmd: "sind doctor", at: "doctor:sind" },
        {
          out: [
            "✓ Docker Engine: 28.1.1 (>= 28.0)",
            "✓ Docker daemon: rootful, no userns-remap",
            "✓ Docker host: this machine (unix:///var/run/docker.sock)",
            "✓ cgroupv2: nsdelegate enabled (/sys/fs/cgroup)",
            "✓ inotify: max_user_instances 8192 (>= 1024)",
            "✓ DNS policy: host resolution available",
          ].join("\n"),
          at: "doctor:looks",
        },
        { mark: "Docker Engine", at: "doctor:version", until: "doctor:daemon#0" },
        { mark: "Docker daemon", at: "doctor:daemon#0", until: "doctor:where" },
        { mark: "Docker host", at: "doctor:where", until: "doctor:cgroup" },
        { mark: "cgroupv2", at: "doctor:cgroup", until: "doctorok:Every" },
        { mark: "✓", at: "doctorok:check#0", until: "doctorok:fails" },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Create a cluster",
      say: [
        { id: "create", mood: "happy" },
        { id: "check", mood: "smug", cues: { running: "joy" } },
        { id: "nodes", mood: "neutral", cues: { address: "happy" } },
      ],
      steps: [
        { cmd: "sind create cluster", at: "create:Run" },
        { ff: "⏩ fast-forward", after: 0.5, hold: 1.8 },
        { prompt: true, after: 0.9 },
        { cmd: "sind get clusters", at: "check:sind#1" },
        { out: "NAME      NODES (S/C/D/W)   SLURM     STATUS\ndefault   2 (0/1/0/1)       26.05.4   running", at: "check:reports" },
        { mark: "running", at: "check:running", delay: -0.1, until: "nodes:sind" },
        { cmd: "sind get nodes", at: "nodes:sind" },
        {
          out: [
            "CONTAINER                CLUSTER   ROLE         FQDN                            IP           STATUS",
            "sind-default-controller  default   controller   controller.default.sind.sind    172.19.0.2   running",
            "sind-default-worker-0    default   worker       worker-0.default.sind.sind      172.19.0.3   running",
          ].join("\n"),
          at: "nodes:every",
        },
        { mark: "worker-0.default.sind.sind", at: "nodes:host", until: "nodes:IP" },
        { mark: "172.19.0.3", at: "nodes:IP" },
      ],
    })
    .diagram({
      chapter: "Your directory on every node",
      title: "Your directory, on every node",
      say: [
        { id: "data", mood: "neutral", cues: { easy: "smug", data: "happy" } },
        { id: "data2", mood: "neutral", cues: { output: "happy" } },
      ],
      grid: [3, 2],
      nodes: [
        { id: "host", title: "your directory", text: "current directory", icon: "host", pos: [0, 0.5], width: 340, accent: true, at: "data:current" },
        { id: "ctl", title: "controller", text: "/data", icon: "server", pos: [2, 0], width: 300, at: "data:every" },
        { id: "w0", title: "worker-0", text: "/data", icon: "nodes", pos: [2, 1], width: 300, at: "data:every" },
      ],
      groups: [{ id: "cl", label: "cluster default", around: ["ctl", "w0"], at: "data:every" }],
      edges: [
        { from: "host", to: "ctl", label: "bind mount", accent: true, at: "data:data" },
        { from: "host", to: "w0", label: "bind mount", accent: true, at: "data:data+0.2" },
      ],
      pulse: [
        { node: "ctl", at: "data2:controller" },
        { node: "w0", at: "data2:worker" },
        { node: "host", at: "data2:output" },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Submit a job",
      say: [
        { id: "script", mood: "neutral" },
        { id: "submit", mood: "neutral", cues: { answers: "happy" } },
        { id: "output", mood: "happy", cues: { Hello: "joy" } },
      ],
      steps: [
        { cmd: "cat > job.sh << 'EOF'\n#!/bin/bash\n#SBATCH --job-name=hello\necho \"Hello from $(hostname)\"\nsleep 30\nEOF", at: "script:write" },
        { cmd: "sind exec -- sbatch job.sh", at: "submit:Submit" },
        { out: "Submitted batch job <JOBID>", at: "submit:answers" },
        { ff: "⏩ fast-forward", at: "output:Once", hold: 1.6 },
        { cmd: "cat slurm-<JOBID>.out", at: "output:output" },
        { out: "Hello from worker-0", at: "output:Hello" },
        { mark: "worker-0", at: "output:worker" },
      ],
    })
    .terminal({
      chapter: "SSH in and clean up",
      say: [
        { id: "ssh", mood: "neutral", cues: { root: "smug" } },
        { id: "sshhome", mood: "neutral" },
        { id: "delete", mood: "neutral" },
        { id: "delete2", mood: "happy", cues: { cleans: "joy" }, gap: 0.6 },
      ],
      steps: [
        // The last command of the previous scene, already typed: the same session.
        { cmd: "cat slurm-<JOBID>.out", at: "output:output" },
        { out: "Hello from worker-0", at: "output:Hello" },
        { cmd: "sind ssh worker-0", at: "ssh:sind" },
        // Back from the node, on the host again.
        { ff: "⏩ fast-forward", at: "delete:Back", hold: 1.6 },
        { prompt: true, at: "delete:machine" },
        { cmd: "sind delete cluster default", at: "delete:sind" },
        { prompt: true, after: 0.9 },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: [
        { id: "take1", mood: "happy" },
        { id: "take2", mood: "happy" },
        { id: "take3", mood: "happy", cues: { every: "joy" } },
      ],
      bullets: [
        { icon: "check", title: "sind doctor first", text: "it checks the host and says how to fix it", at: "take1:doctor" },
        { icon: "terminal", title: "One command to a cluster", text: "sind create cluster, and sind delete cluster", at: "take2:command" },
        { icon: "disk", title: "Your directory on every node", text: "mounted as /data, so jobs see your files", at: "take3:current" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "03 · Inside a sind cluster", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
