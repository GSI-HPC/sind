<style>

  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }

  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Unmanaged Cluster: docs/content/guides/unmanaged-cluster.md. The config,
  // the commands, the provisioning by hand and the Ansible inventory are
  // copied from that page; keep both in sync.
  const SERIES = "Unmanaged Cluster";
  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "unmanaged-cluster", title: "Unmanaged Cluster: Slurm from your own tooling", series: SERIES })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Guides", title: "Unmanaged Cluster", say: "intro" })
    .talk({
      chapter: "Why an unmanaged cluster",
      kicker: "Guides",
      title: "Slurm from your own tooling",
      sub: "sind brings the nodes, networking, SSH and munge. You bring Slurm.",
      chips: ["Chef or Ansible", "slurm.conf", "Debug by hand"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [{ id: "why", mood: "thinking" }, { id: "why2", mood: "neutral", cues: { tooling: "happy" } }],
    })
    .code({
      chapter: "Create an unmanaged cluster",
      title: "managed: false",
      file: "unmanaged.yaml",
      lang: "yaml",
      say: { id: "config", mood: "neutral", cues: { unmanaged: "happy" } },
      text: ["kind: Cluster", "name: dev", "nodes:", "  - role: controller", "    managed: false", "  - role: submitter", "  - role: worker", "    count: 2"].join("\n"),
      marks: [
        { line: 4, at: "config:managed" },
        { line: 5, at: "config:managed" },
        { line: 6, at: "config:whole" },
        { line: 7, at: "config:whole" },
        { line: 8, at: "config:whole" },
      ],
    })
    .slide({
      chapter: "What sind sets up",
      title: "What sind sets up",
      say: [{ id: "setup", mood: "neutral" }, { id: "notset", mood: "neutral", cues: { daemon: "smug" } }],
      bullets: [
        { icon: "docker", title: "Containers, networks, DNS, SSH access", text: "as in a managed cluster", at: "setup:containers" },
        { icon: "key", title: "munge key, munge running", text: "/etc/munge is read-only on every node", at: "setup:munge" },
        { icon: "job", title: "/etc/slurm: empty", text: "one volume, writable on the controllers", at: "notset:configuration" },
        { icon: "server", title: "slurmctld and slurmd: not started", text: "nor MariaDB, slurmdbd or slurmrestd on db and api nodes", at: "notset:daemon" },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Provision Slurm",
      say: [{ id: "create", mood: "happy" }, { id: "heredoc", mood: "neutral", cues: { share: "happy" } }],
      steps: [
        { cmd: "sind create cluster --config unmanaged.yaml", at: "create:Create" },
        { ff: "⏩ fast-forward", at: "create:Once", hold: 1.2 },
        { prompt: true, at: "create:hands" },
        { cmd: "sind ssh controller.dev -- 'cat > /etc/slurm/slurm.conf' <<'EOF'", at: "heredoc:By" },
        {
          out: [
            "ClusterName=dev",
            "SlurmctldHost=controller",
            "SlurmUser=slurm",
            "StateSaveLocation=/var/spool/slurmctld",
            "SlurmdSpoolDir=/var/spool/slurmd",
            "ProctrackType=proctrack/cgroup",
            "TaskPlugin=task/cgroup",
            "ReturnToService=2",
            "NodeName=worker-[0-1] CPUs=1 State=UNKNOWN",
            "PartitionName=all Nodes=ALL Default=YES MaxTime=INFINITE State=UP",
            "EOF",
          ].join("\n"),
          after: 0.3,
        },
        { mark: "/etc/slurm/slurm.conf", at: "heredoc:controller" },
        { prompt: true, after: 0.4 },
      ],
    })
    // srun hostname prints the worker names, but the page shows no output, so
    // the rest of the setup is shown as what you run.
    .code({
      wide: true,
      chapter: "Start the daemons",
      title: "Then start the daemons",
      file: "what you run",
      lang: "sh",
      say: [{ id: "start", mood: "neutral" }, { id: "workers", mood: "happy", gap: 0.8 }],
      text: [
        "sind ssh controller.dev -- 'echo CgroupPlugin=autodetect > /etc/slurm/cgroup.conf'",
        "sind ssh controller.dev -- systemctl start slurmctld",
        "sind ssh worker-0.dev -- systemctl start slurmd",
        "sind ssh worker-1.dev -- systemctl start slurmd",
        "sind exec dev -- srun -N2 hostname",
      ].join("\n"),
      reveal: [
        { lines: [1, 1], at: "start:cgroup" },
        { lines: [2, 2], at: "start:slurmctld" },
        { lines: [3, 4], at: "workers:slurmd" },
        { lines: [5, 5], at: "workers:last" },
      ],
      marks: [{ line: 5, at: "workers:first" }],
    })
    .code({
      chapter: "Chef and Ansible",
      title: "Nodes as SSH hosts",
      file: "Ansible inventory",
      lang: "text",
      say: { id: "ansible", mood: "neutral", cues: { hosts: "happy" } },
      text: [
        "[slurm_controller]",
        "controller.dev.sind.sind",
        "",
        "[slurm_submitter]",
        "submitter.dev.sind.sind",
        "",
        "[slurm_workers]",
        "worker-0.dev.sind.sind",
        "worker-1.dev.sind.sind",
      ].join("\n"),
      marks: [{ text: ".sind.sind", at: "ansible:names" }],
    })
    .slide({
      chapter: "More on this page",
      title: "Also on this page",
      say: [{ id: "more1", mood: "neutral" }, { id: "more2", mood: "neutral", cues: { yourself: "happy" } }],
      bullets: [
        { icon: "terminal", title: "Run slurmctld by hand", text: "sind ssh -t controller.dev -- slurmctld -Dvvvvvv", at: "more1:slurmctld" },
        { icon: "server", title: "Controller pair", text: "backupController: true adds controller-backup", at: "more2:Backup" },
        { icon: "nodes", title: "Workers", text: "sind create worker dev adds unmanaged workers", at: "more2:workers" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "takeaway", mood: "neutral", cues: { tooling: "happy" } },
      bullets: [
        { icon: "gear", title: "managed: false", text: "on the controller, for the whole cluster", at: "takeaway:managed" },
        { icon: "key", title: "Nodes with SSH and munge", text: "/etc/slurm starts empty", at: "takeaway:nodes" },
        { icon: "terminal", title: "Slurm from your tooling", text: "by hand, or Chef and Ansible over SSH", at: "takeaway:tooling" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Using CVMFS", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
