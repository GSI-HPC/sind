<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Realms: docs/content/configuration/realms.md. Terminal commands are copied
  // from that page ("Example" and "Setting the realm"); keep both in sync. The
  // diagram follows its "Resource naming" table.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "realms", title: "Realms: clusters side by side", series: "Realms" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Configuration", title: "Realms", say: "intro" })
    .talk({
      chapter: "Why realms",
      kicker: "Configuration",
      title: "Clusters that don't collide",
      sub: "A realm keeps parallel jobs and environments apart, each with its own mesh, DNS and SSH.",
      chips: ["Parallel CI jobs", "Own mesh each", "No conflicts"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "thinking", cues: { Without: "concerned" } },
    })
    .diagram({
      chapter: "One namespace per realm",
      title: "Everything sind creates, per realm",
      shot: "mini",
      say: [
        { id: "what", mood: "neutral" },
        { id: "prefix", mood: "neutral", cues: { mesh: "smug" } },
        { id: "apart", mood: "neutral", cues: { never: "happy" } },
      ],
      grid: [4, 2.5],
      nodes: [
        { id: "m1", title: "Mesh", text: "sind-mesh", code: true, icon: "network", pos: [0, 0], width: 330, at: "what:mesh" },
        { id: "d1", title: "DNS", text: "sind-dns", code: true, icon: "globe", pos: [1, 0], width: 330, at: "what:DNS" },
        { id: "s1", title: "SSH relay", text: "sind-ssh", code: true, icon: "key", pos: [2, 0], width: 330, at: "what:SSH" },
        { id: "c1", title: "Cluster net", text: "sind-default-net", code: true, icon: "nodes", pos: [3, 0], width: 330, at: "what:cluster" },
        { id: "m2", title: "Mesh", text: "ci-42-mesh", code: true, icon: "network", pos: [0, 1.5], width: 330, at: "apart:copies" },
        { id: "d2", title: "DNS", text: "ci-42-dns", code: true, icon: "globe", pos: [1, 1.5], width: 330, at: "apart:copies" },
        { id: "s2", title: "SSH relay", text: "ci-42-ssh", code: true, icon: "key", pos: [2, 1.5], width: 330, at: "apart:copies" },
        { id: "c2", title: "Cluster net", text: "ci-42-default-net", code: true, icon: "nodes", pos: [3, 1.5], width: 330, at: "apart:copies" },
      ],
      groups: [
        { id: "r1", label: "realm sind · the default", around: ["m1", "d1", "s1", "c1"], accent: true, at: "prefix:default" },
        { id: "r2", label: "realm ci-42", around: ["m2", "d2", "s2", "c2"], at: "apart:Another" },
      ],
      edges: [{ from: "r1", to: "r2", label: "✗ can't see each other", dashed: true, arrow: "none", at: "apart:see" }],
      pulse: [{ node: "m1", at: "prefix:front" }],
    })
    .terminal({
      chapter: "Two realms side by side",
      say: [
        { id: "demo", mood: "happy", cues: { conflict: "joy" } },
        { id: "down", mood: "neutral", gap: 1.8 },
      ],
      steps: [
        { cmd: "sind --realm dev create cluster app", at: "demo:Here" },
        { ff: "⏩ fast-forward", after: 0.3, hold: 1.0 },
        { prompt: true, after: 1.0 },
        { cmd: "sind --realm staging create cluster app", after: 0.3 },
        { ff: "⏩ fast-forward", after: 0.3, hold: 1.0 },
        { prompt: true, after: 1.0 },
        { cmd: "sind --realm dev delete cluster app", at: "down:And" },
        { prompt: true, after: 0.5 },
        { cmd: "sind --realm staging delete cluster app", after: 0.3 },
        { prompt: true, after: 0.5 },
      ],
    })
    .slide({
      chapter: "Which realm?",
      title: "Which realm a command uses",
      say: [
        { id: "prec1", mood: "neutral" },
        { id: "prec2", mood: "neutral" },
      ],
      bullets: [
        { icon: "terminal", title: "1 · the --realm flag", text: "sind --realm ci-42 create cluster", at: "prec1:flag" },
        { icon: "gear", title: "2 · SIND_REALM", text: "export SIND_REALM=ci-42", at: "prec1:environment" },
        { icon: "job", title: "3 · realm in the config file", text: "realm: ci-42 · read by sind create cluster only", at: "prec2:configuration" },
        { icon: "check", title: "4 · the default", text: "sind", at: "prec2:default" },
      ],
    })
    .terminal({
      chapter: "A realm from the config file",
      say: [
        { id: "pass1", mood: "thinking" },
        { id: "pass2", mood: "neutral", cues: { same: "smug" }, gap: 0.8 },
      ],
      steps: [
        { cmd: "sind create cluster --config dev.yaml       # dev.yaml sets realm: ci-42", at: "pass1:Here" },
        { ff: "⏩ fast-forward", after: 0.3, hold: 1.0 },
        { prompt: true, after: 1.0 },
        { cmd: "sind --realm ci-42 delete cluster dev", at: "pass2:same" },
        { prompt: true, after: 0.5 },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "take", mood: "happy" },
      bullets: [
        { icon: "nodes", title: "One realm per parallel job", text: "its own mesh, DNS, SSH and clusters", at: "take:One" },
        { icon: "terminal", title: "Pass it to every command", text: "--realm or SIND_REALM", at: "take:passed" },
        { icon: "lock", title: "Locks are per realm", text: "different realms never wait for each other", at: "take:lock" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Cluster Lifecycle", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
