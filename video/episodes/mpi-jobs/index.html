<head>

<title>sind Running MPI Jobs</title>
<script src="vendor/gsap.min.js"></script>

<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Running MPI Jobs: docs/content/guides/mpi-jobs.md. The cluster config,
  // hello_mpi.c, mpi_job.sh, the commands and the srun output are copied from
  // that page; keep both in sync.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "mpi-jobs", title: "Running MPI Jobs: one program across three workers", series: "Running MPI Jobs" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Guides", title: "Running MPI Jobs", say: "intro" })
    .talk({
      chapter: "Why a real cluster",
      kicker: "Guides",
      title: "MPI across three workers",
      sub: "Compile a hello world, then run one rank per worker with srun and sbatch.",
      chips: ["Open MPI + PMIx", "3 workers", "srun · sbatch"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "neutral", cues: { Docker: "happy" } },
    })
    .slide({
      chapter: "The MPI stack",
      title: "Built into the node image",
      say: { id: "stack", mood: "neutral", cues: { Slurm: "smug" } },
      bullets: [
        { icon: "gear", title: "Open MPI", text: "with mpicc to compile", at: "stack:Open" },
        { icon: "network", title: "PMIx", text: "process launch", at: "stack:PMIx#0" },
        { icon: "nodes", title: "UCX", text: "the point-to-point layer", at: "stack:UCX" },
        { icon: "check", title: "Slurm: MpiDefault=pmix", text: "srun launches with PMIx", at: "stack:Slurm" },
      ],
    })
    .terminal({
      chapter: "Create a cluster",
      say: [{ id: "create", mood: "happy" }],
      steps: [
        { cmd: "sind create cluster --config - <<'EOF'", at: "create:First" },
        { out: "kind: Cluster\nnodes:\n  - controller\n  - worker: 3\nEOF", at: "create:Run" },
        { ff: "⏩ fast-forward", at: "create:configuration", hold: 1.4 },
        { prompt: true, after: 1.4 },
      ],
    })
    .code({
      chapter: "Write an MPI program",
      file: "hello_mpi.c",
      lang: "c",
      text: [
        "int main(int argc, char **argv) {",
        "    MPI_Init(&argc, &argv);",
        "",
        "    int rank, size;",
        "    char hostname[256];",
        "    MPI_Comm_rank(MPI_COMM_WORLD, &rank);",
        "    MPI_Comm_size(MPI_COMM_WORLD, &size);",
        "    gethostname(hostname, sizeof(hostname));",
        "",
        "    MPI_Barrier(MPI_COMM_WORLD);",
        '    printf("rank %d of %d on %s\\n", rank, size, hostname);',
        "",
        "    MPI_Finalize();",
        "    return 0;",
        "}",
      ].join("\n"),
      say: [{ id: "code1" }, { id: "code2" }, { id: "code3", gap: 0.5 }],
      marks: [
        { text: "MPI_Comm_rank", at: "code2:number", until: "code3:barrier" },
        { text: "MPI_Comm_size", at: "code2:many", until: "code3:barrier" },
        { text: "MPI_Barrier", at: "code3:barrier" },
        { text: "printf", at: "code3:prints" },
      ],
    })
    .terminal({
      chapter: "Compile and run",
      say: [
        { id: "compile", mood: "neutral" },
        { id: "run", mood: "happy" },
        { id: "result", mood: "joy", cues: { order: "neutral" } },
        { id: "pmix", mood: "smug" },
      ],
      steps: [
        { cmd: "sind exec -- mpicc -o hello_mpi hello_mpi.c", at: "compile:Build" },
        { prompt: true, at: "compile:wrapper" },
        { cmd: "sind exec -- srun -N3 --ntasks-per-node=1 ./hello_mpi", at: "run:srun" },
        { out: "rank 0 of 3 on worker-0\nrank 1 of 3 on worker-1\nrank 2 of 3 on worker-2", at: "result:Three" },
        { mark: "of 3", at: "result:ranks", until: "pmix:Notice" },
      ],
    })
    // sbatch prints the job ID and the job writes slurm-*.out, but the page
    // shows neither, so the batch step is shown as what you run.
    .code({
      chapter: "Batch submission",
      title: "The same program as a batch job",
      file: "what you run",
      lang: "sh",
      text: [
        `sind exec -- sh -c 'cat > mpi_job.sh << "SCRIPT"`,
        "#!/bin/sh",
        "#SBATCH --job-name=mpi-hello",
        "#SBATCH --nodes=3",
        "#SBATCH --ntasks-per-node=1",
        "srun hello_mpi",
        "SCRIPT'",
        "",
        "sind exec -- sbatch --wait mpi_job.sh",
        "sind exec -- sh -c 'cat slurm-*.out'",
      ].join("\n"),
      say: [
        { id: "batch", mood: "neutral" },
        { id: "submit", mood: "happy", gap: 0.6 },
      ],
      reveal: [
        { lines: [9, 9], at: "submit:sbatch" },
        { lines: [10, 10], at: "submit:cat" },
      ],
      marks: [
        { text: "--nodes=3", at: "batch:three", until: "batch:task" },
        { text: "--ntasks-per-node=1", at: "batch:task", until: "batch:calls" },
        { text: "srun hello_mpi", at: "batch:calls", until: "submit:sbatch" },
        { text: "--wait", at: "submit:wait", until: "submit:cat" },
        { text: "slurm-*.out", at: "submit:output" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "takeaway", cues: { same: "happy" } },
      bullets: [
        { icon: "gear", title: "The MPI stack is built in", text: "Open MPI, PMIx and UCX in the default image", at: "takeaway:stack" },
        { icon: "terminal", title: "srun needs no extra flags", text: "MpiDefault=pmix in the generated slurm.conf", at: "takeaway:srun" },
        { icon: "job", title: "Batch jobs work the same way", text: "srun inside an sbatch script", at: "takeaway:batch" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "MCP Integration", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
