<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind CI/CD</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // CI/CD: docs/content/guides/ci-cd.md. The job steps and the SlurmdTimeout
  // config are copied from that page; keep both in sync.

  const SERIES = "CI/CD";
  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "ci-cd", title: "CI/CD: a real Slurm cluster in every pipeline", series: SERIES })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Guides", title: "CI/CD", say: "intro" })
    .talk({
      chapter: "Why a real cluster in CI",
      kicker: "Guides",
      title: "A real Slurm in every CI run",
      sub: "GitHub Actions, or any CI with a rootful Docker daemon.",
      chips: ["sind-action", "Any CI", "Realms"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "neutral", cues: { real: "happy", How: "thinking" } },
    })
    .slide({
      chapter: "GitHub Action",
      title: "On GitHub: sind-action",
      say: [{ id: "action", mood: "happy" }, { id: "runners", mood: "neutral", cues: { sudo: "smug" } }],
      bullets: [
        { icon: "check", title: "sind-action", text: "installs sind and creates clusters in your workflow", at: "action:install" },
        { icon: "server", title: "Standard GitHub-hosted runners", text: "ubuntu-latest (x64) and ubuntu-24.04-arm", at: "runners:Ubuntu" },
        { icon: "docker", title: "The runner's Docker daemon", text: "no sudo, privileged containers or custom runner images", at: "runners:sudo" },
      ],
    });

  ep.code({
    chapter: "Other CI systems",
    title: "Any CI with rootful Docker",
    file: "job steps",
    lang: "sh",
    say: [{ id: "other", mood: "neutral" }, { id: "doctor", mood: "neutral", cues: { builds: "happy" }, gap: 0.6 }],
    text: [
      "curl -fsSL -o sind-linux-amd64 \\",
      '  "https://github.com/GSI-HPC/sind/releases/latest/download/sind-linux-amd64"',
      "gh attestation verify sind-linux-amd64 --repo GSI-HPC/sind \\",
      "  --signer-workflow GSI-HPC/sind/.github/workflows/release.yml",
      "install -m 755 sind-linux-amd64 ./sind",
      "./sind doctor",
      "./sind create cluster --config cluster.yml",
    ].join("\n"),
    marks: [
      { line: 1, at: "other:Download", until: "other:verify" },
      { line: 2, at: "other:Download", until: "other:verify" },
      { line: 3, at: "other:verify", until: "doctor:doctor" },
      { line: 4, at: "other:verify", until: "doctor:doctor" },
      { line: 6, at: "doctor:doctor", until: "doctor:create" },
      { line: 7, at: "doctor:create" },
    ],
  });

  ep.slide({
    chapter: "Shared Docker daemons",
    title: "One realm per job",
    say: [{ id: "realm", mood: "thinking", cues: { own: "neutral" } }, { id: "lock", mood: "neutral", cues: { delete: "concerned" } }],
    bullets: [
      { icon: "network", title: "SIND_REALM", text: "a realm of its own for every job on a shared daemon", at: "realm:own" },
      { icon: "lock", title: "The realm lock", text: "keeps jobs in one realm from breaking each other's mesh", at: "lock:lock" },
      { icon: "warn", title: "One realm is not isolated", text: "delete cluster --all removes every job's clusters", at: "lock:delete" },
    ],
  })
    .slide({
      chapter: "Workspace and trust",
      title: "Workspace and trust",
      say: [{ id: "data", mood: "neutral" }, { id: "volume", mood: "happy" }, { id: "untrusted", mood: "concerned" }],
      bullets: [
        { icon: "disk", title: "The workspace at /data", text: "root's files there: a cleanup step may need sudo", at: "data:workspace" },
        { icon: "db", title: "--data volume", text: "keeps the workspace out of the cluster", at: "volume:volume" },
        { icon: "warn", title: "Configs are as trusted as scripts", text: "none from untrusted pull requests in privileged workflows", at: "untrusted:untrusted" },
      ],
    });

  ep.code({
    chapter: "Node failure tests",
    title: "Fail fast: SlurmdTimeout",
    file: "cluster config",
    lang: "yaml",
    say: [{ id: "failure", mood: "neutral" }, { id: "timeout", mood: "thinking", cues: { lower: "smug" }, gap: 0.8 }],
    text: ["slurm:", "  main: |", "    SlurmdTimeout=30"].join("\n"),
    marks: [{ text: "SlurmdTimeout", at: "timeout:lower" }],
    notes: [
      { icon: "terminal", text: "sind power freeze, cut or shutdown takes a worker away", at: "failure:Freeze" },
      { warn: true, text: "Slurm's default SlurmdTimeout=300: about five minutes", at: "timeout:five" },
    ],
  });

  ep.slide({
    chapter: "Takeaways",
    title: "Takeaways",
    say: { id: "takeaway", mood: "neutral", cues: { failure: "happy" } },
    bullets: [
      { icon: "check", title: "sind-action or a verified binary", text: "GitHub runners, or any CI with rootful Docker", at: "takeaway:action" },
      { icon: "network", title: "One realm per job", text: "SIND_REALM on a shared Docker daemon", at: "takeaway:realm" },
      { icon: "gear", title: "SlurmdTimeout for failure tests", text: "SlurmdTimeout=30 in the cluster config", at: "takeaway:slurmd" },
    ],
  });

  ep.outro({ chapter: "Wrap-up", next: "Controller Failover", say: "outro" }).done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
