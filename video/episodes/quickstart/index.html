<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind Quickstart</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Quickstart: docs/content/getting-started/quickstart.md. Terminal output is
  // copied from that page; keep both in sync.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "quickstart", title: "Quickstart: your first Slurm cluster", series: "Quickstart" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Getting started", title: "Quickstart", say: "intro" })
    .talk({
      chapter: "What you'll build",
      kicker: "Getting started",
      title: "Your first Slurm cluster",
      sub: "One command, about a minute, nothing to install on the host but Docker.",
      chips: ["Requires Docker", "~1 min", "1 controller + 1 worker"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "welcome", cues: { Docker: "happy" }, look: { complete: 0.35, It: "camera" } },
    })
    .slide({
      chapter: "What sind sets up",
      label: "What sind does",
      title: "One command sets up…",
      say: "what",
      bullets: [
        { icon: "network", title: "Network, DNS and SSH", text: "a shared mesh so nodes find each other by name", at: "what:network" },
        { icon: "key", title: "Munge key and slurm.conf", text: "generated for this cluster's nodes", at: "what:munge" },
        { icon: "nodes", title: "One container per node", text: "systemd inside, just like bare metal", at: "what:starts" },
      ],
    })
    .terminal({
      chapter: "Create and check a cluster",
      label: "Create a cluster",
      say: [{ id: "create", mood: "happy" }, { id: "check", mood: "smug", cues: { Now: "neutral", running: "joy" } }],
      steps: [
        { cmd: "sind create cluster", at: "create:Run" },
        { ff: "⏩ ~40 s later", after: 0.5, hold: 1.8 },
        { prompt: true, after: 0.9 },
        { cmd: "sind get clusters", at: "check:Now" },
        { out: "NAME      NODES (S/C/D/A/W)   SLURM     STATUS\ndefault   2 (0/1/0/0/1)       26.05.4   running", at: "check:shows" },
        { mark: "running", at: "check:running", delay: -0.1 },
      ],
    })
    .terminal({
      wide: true,
      chapter: "Inspect the nodes",
      say: { id: "nodes", mood: "neutral", cues: { address: "happy" } },
      steps: [
        { cmd: "sind get nodes", at: "nodes:sind" },
        {
          out: [
            "CONTAINER                CLUSTER   ROLE         FQDN                            IP           STATUS",
            "sind-default-controller  default   controller   controller.default.sind.sind    172.19.0.2   running",
            "sind-default-worker-0    default   worker       worker-0.default.sind.sind      172.19.0.3   running",
          ].join("\n"),
          at: "nodes:lists",
        },
        { mark: "controller.default.sind.sind", at: "nodes:host", until: "nodes:IP" },
        { mark: "172.19.0.2", at: "nodes:IP" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Cluster Configuration", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
