<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Refresher, MPI ranks and srun: docs/content/course/refreshers.md
  // ("MPI ranks and srun"). General MPI background, no terminal; srun and
  // PMIx as docs/content/guides/mpi-jobs.md describes them. Its shortened cut
  // is the refresher chapter of course-04-job-scripts
  // (docs/content/course/04-job-scripts.md).
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "refresher-mpi", title: "Refresher: MPI ranks and srun", series: "Refresher" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Refresher", title: "MPI ranks and srun", say: "intro" })
    .talk({
      chapter: "One program, many nodes",
      kicker: "Refresher",
      title: "How does one program run on many nodes?",
      sub: "Your simulation on three nodes: MPI ranks, and how srun starts them.",
      chips: ["MPI", "Ranks", "srun + PMIx"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [
        { id: "hook", mood: "thinking" },
        { id: "usecase", mood: "happy" },
      ],
    })
    .diagram({
      chapter: "Ranks and messages",
      title: "One program, many ranks",
      say: [
        { id: "ranks", mood: "neutral" },
        { id: "size", mood: "neutral" },
        { id: "messages", mood: "neutral", cues: { messages: "happy" } },
      ],
      shot: "mini",
      grid: [5, 2],
      nodes: [
        { id: "prog", title: "MPI program", text: "one executable", icon: "job", pos: [2, 1], width: 320, accent: true, at: "ranks:program" },
        { id: "r0", title: "rank 0", text: "process", icon: "gear", pos: [0, 0], at: "ranks:copies" },
        { id: "r1", title: "rank 1", text: "process", icon: "gear", pos: [1, 0], at: "ranks:copies+0.15" },
        { id: "r2", title: "rank 2", text: "process", icon: "gear", pos: [3, 0], at: "ranks:copies+0.3" },
        { id: "r3", title: "rank 3", text: "process", icon: "gear", pos: [4, 0], at: "ranks:copies+0.45" },
      ],
      groups: [
        { id: "nA", label: "node A", around: ["r0", "r1"], at: "messages:nodes" },
        { id: "nB", label: "node B", around: ["r2", "r3"], at: "messages:nodes+0.2" },
      ],
      edges: [
        { from: "prog", to: "r0", dashed: true, at: "ranks:copies" },
        { from: "prog", to: "r1", dashed: true, at: "ranks:copies+0.15" },
        { from: "prog", to: "r2", dashed: true, at: "ranks:copies+0.3" },
        { from: "prog", to: "r3", dashed: true, at: "ranks:copies+0.45" },
        { from: "r1", to: "r2", arrow: "both", dashed: true, accent: true, label: "messages", at: "messages:messages" },
      ],
      pulse: [
        { node: "r0", at: "size:number" },
        { node: "r1", at: "size:number+0.1" },
        { node: "r2", at: "size:number+0.2" },
        { node: "r3", at: "size:number+0.3" },
      ],
    })
    .diagram({
      chapter: "How srun starts them",
      title: "srun starts one task per rank",
      shot: "mini",
      say: [
        { id: "alloc", mood: "neutral" },
        { id: "pmix", mood: "neutral", cues: { others: "happy" } },
        { id: "alone", mood: "smug" },
      ],
      grid: [4, 2],
      nodes: [
        { id: "slurm", title: "Slurm", text: "allocates nodes", icon: "server", pos: [-0.15, 1], width: 280, at: "alloc:Slurm" },
        { id: "srun", title: "srun", text: "one task per rank", icon: "terminal", pos: [2, 0], width: 300, accent: true, at: "alloc:srun" },
        { id: "mpirun", title: "mpirun", text: "not needed", icon: "warn", pos: [3, 0], ghost: true, at: "alone:mpirun" },
        { id: "w0", title: "worker-0", text: "rank 0", icon: "nodes", pos: [1, 1], at: "alloc:three" },
        { id: "w1", title: "worker-1", text: "rank 1", icon: "nodes", pos: [2, 1], at: "alloc:three+0.15" },
        { id: "w2", title: "worker-2", text: "rank 2", icon: "nodes", pos: [3, 1], at: "alloc:three+0.3" },
      ],
      groups: [{ id: "job", label: "allocated to the job", around: ["w0", "w1", "w2"], at: "alloc:job" }],
      edges: [
        { from: "slurm", to: "job", at: "alloc:job+0.2" },
        { from: "srun", to: "w0", at: "alloc:starts" },
        { from: "srun", to: "w1", at: "alloc:starts+0.15" },
        { from: "srun", to: "w2", at: "alloc:starts+0.3" },
        { from: "w0", to: "w1", arrow: "both", dashed: true, accent: true, at: "pmix:reach" },
        { from: "w1", to: "w2", arrow: "both", dashed: true, accent: true, at: "pmix:reach+0.2" },
      ],
      pulse: [
        { node: "slurm", at: "alloc:allocates" },
        { node: "srun", at: "pmix:PMIx" },
        { node: "w0", at: "pmix:rank" },
        { node: "w1", at: "pmix:rank+0.1" },
        { node: "w2", at: "pmix:rank+0.2" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "takeaway", mood: "happy" },
      bullets: [
        { icon: "gear", title: "A rank is one process", text: "numbered from zero, and it knows the total", at: "takeaway:rank#0" },
        { icon: "network", title: "Ranks talk by messages", text: "no shared memory across nodes", at: "takeaway:messages" },
        { icon: "terminal", title: "srun starts one task per rank", text: "PMIx tells each task where it fits", at: "takeaway:srun" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "04 · Test your job scripts before the queue", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
