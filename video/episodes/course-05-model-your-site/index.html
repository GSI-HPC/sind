<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind course 05: Model your site</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

  /* Command bullets: a slide whose bullet titles are commands. */
  .cmds .bullet .t1 { font-family: "JetBrains Mono", monospace; font-size: 31px; font-weight: 400; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Course 05, Model your site: docs/content/course/05-model-your-site.md.
  // cluster.yaml is the example in docs/content/guides/users.md plus the
  // storage section of docs/content/guides/cvmfs.md; the create command is
  // from docs/content/usage/cluster-lifecycle.md and guides/cvmfs.md, the user
  // commands and the account tree from guides/users.md. The course page copies
  // all of it; keep them in sync.
  const SERIES = "Course 05";

  const lines = (...l) => l.join("\n");

  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "course-05-model-your-site", title: "05 · Model your site", series: SERIES })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "The sind course · 05", title: "Model your site", say: "intro" })
    .talk({
      chapter: "A cluster like your site",
      kicker: "Testing site policy",
      title: "Passes here, fails at your site?",
      sub: "A test cluster with your site's roles, limits, users, Slurm accounts and software.",
      chips: ["One YAML file", "Accounts · limits", "CVMFS"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [
        { id: "hook", mood: "thinking", cues: { Your: "concerned" } },
        { id: "usecase", mood: "neutral", cues: { shaped: "happy" }, look: { shaped: "camera" } },
      ],
    })
    .slide({
      chapter: "The plan",
      title: "One file, four steps",
      say: [{ id: "plan", cues: { cluster: "happy" } }, { id: "needs", mood: "happy", cues: { plus: "neutral" } }],
      bullets: [
        { icon: "nodes", title: "Nodes", text: "controller, db, submitter and workers", at: "plan:nodes" },
        { icon: "gear", title: "Limits", text: "CPUs and memory for every node", at: "plan:limits" },
        { icon: "user", title: "Users and accounts", text: "Linux users with Slurm associations", at: "plan:users" },
        { icon: "disk", title: "Software from CVMFS", text: "mounted read-only on every node", at: "plan:CVMFS" },
      ],
    });

  ep.code({
    chapter: "Nodes and limits",
    title: "Nodes and limits",
    file: "cluster.yaml",
    lang: "yaml",
    text: lines("kind: Cluster", "defaults:", "  cpus: 2", "nodes: [controller, db, submitter, worker: 3]"),
    say: [{ id: "nodes" }, { id: "limits" }, { id: "slurmsees", cues: { same: "smug" } }],
    reveal: [
      { lines: [1, 1], at: "nodes:kind" },
      { lines: [4, 4], at: "nodes:nodes" },
      { lines: [2, 3], at: "limits:defaults" },
    ],
    marks: [
      { text: "nodes:", at: "nodes:controller", until: "limits:defaults" },
      { text: "  cpus: 2", at: "limits:two", until: "slurmsees:managed" },
    ],
    notes: [
      { icon: "nodes", text: "controller, db, submitter and three workers", at: "nodes:workers" },
      { icon: "gear", text: "a managed worker's Slurm CPUs and RealMemory", at: "slurmsees:same" },
    ],
  });

  ep.diagram({
    chapter: "Refresher: Accounting and associations",
    label: "Refresher · Accounting and associations",
    title: "Accounting and associations",
    say: [
      { id: "r1" },
      { id: "r2", cues: { limits: "smug" } },
      { id: "r3", cues: { But: "thinking" } },
    ],
    grid: [3, 2],
    nodes: [
      { id: "ctld", title: "slurmctld", text: "controller", icon: "server", pos: [0, 0], at: "r1:slurmctld" },
      { id: "dbd", title: "slurmdbd", text: "db node", icon: "server", pos: [1, 0], accent: true, at: "r1:slurmdbd" },
      { id: "sql", title: "MariaDB", text: "job records", icon: "db", pos: [2, 0], at: "r1:database" },
      { id: "user", title: "alice", text: "user", icon: "user", pos: [0, 1], at: "r2:user" },
      { id: "acct", title: "theory", text: "account", icon: "job", pos: [1, 1], at: "r2:account" },
      { id: "tool", title: "sacctmgr", text: "manages them", icon: "terminal", pos: [2, 1], at: "r3:sacctmgr" },
    ],
    groups: [{ id: "assoc", label: "association · limits", around: ["user", "acct"], accent: true, at: "r2:association" }],
    edges: [
      { from: "ctld", to: "dbd", label: "jobs", at: "r1:reports" },
      { from: "dbd", to: "sql", at: "r1:database" },
      { from: "user", to: "acct", arrow: "both", at: "r2:account+0.3" },
      { from: "tool", to: "dbd", at: "r3:sacctmgr+0.3" },
    ],
    pulse: [
      { node: "acct", at: "r2:limits" },
      { node: "ctld", at: "r3:enforcement" },
    ],
  });

  ep.code({
    chapter: "Users and accounts",
    title: "Enforcement and accounts",
    file: "cluster.yaml",
    lang: "yaml",
    text: lines(
      "slurm:",
      "  main: |",
      "    AccountingStorageEnforce=associations,limits",
      "accounts:",
      "  - name: physics",
      "    limits:",
      "      GrpTRES: cpu=4",
      "  - name: theory",
      "    parent: physics",
      "    limits:",
      "      MaxJobs: 1"
    ),
    say: [{ id: "enforce", cues: { turn: "happy", section: "neutral" } }, { id: "accounts" }],
    reveal: [
      { lines: [1, 3], at: "enforce:turn" },
      { lines: [4, 11], at: "accounts:Accounts" },
    ],
    marks: [
      { text: "AccountingStorageEnforce", at: "enforce:enforces", until: "accounts:Accounts" },
      { text: "GrpTRES: cpu=4", at: "accounts:physics" },
      { text: "MaxJobs: 1", at: "accounts:theory" },
    ],
  });

  ep.code({
    label: "Users and accounts",
    title: "Groups and users",
    panels: [
      {
        file: "cluster.yaml, continued",
        lang: "yaml",
        text: lines(
          "groups:",
          "  - name: physics",
          "    gid: 3000",
          "users:",
          "  - name: alice",
          "    uid: 2001",
          "    groups: [physics]",
          "    accounts: [theory]",
          "  - name: bob",
          "    uid: 2002",
          "    groups: [physics]",
          "    accounts: [physics, theory]",
          "    coordinator: [physics]"
        ),
      },
      {
        file: "cluster.yaml, continued",
        lang: "yaml",
        text: lines("  - name: carol", "    uid: 2003", "    accounts: [physics]", "    adminLevel: operator", "  - name: dave", "    uid: 2004"),
      },
    ],
    say: [{ id: "group" }, { id: "users" }, { id: "dave", mood: "smug" }],
    reveal: [
      { lines: [1, 3], at: "group:Linux" },
      { lines: [4, 8], at: "users:alice" },
      { lines: [9, 13], at: "users:bob" },
      { panel: 1, lines: [1, 4], at: "users:carol" },
      { panel: 1, lines: [5, 6], at: "dave:dave" },
    ],
    marks: [
      { text: "    coordinator: [physics]", at: "users:coordinating", until: "users:carol" },
      { text: "    adminLevel: operator", at: "users:operator", until: "dave:dave" },
    ],
  });

  ep.code({
    chapter: "Software from CVMFS",
    title: "Software from CVMFS",
    file: "cluster.yaml, continued",
    lang: "yaml",
    text: lines("storage:", "  cvmfs: true"),
    say: [{ id: "cvmfs", cues: { even: "happy" } }, { id: "backend" }, { id: "backend2", mood: "thinking" }],
    reveal: [{ lines: [1, 2], at: "cvmfs:CVMFS" }],
    marks: [{ text: "  cvmfs: true", at: "cvmfs:true", until: "backend:Repositories" }],
    notes: [
      { icon: "check", text: "repositories mount on demand, also on workers added later", at: "backend:Repositories" },
      { icon: "disk", text: "from the Docker host, or from a cvmfs Docker volume plugin", at: "backend:Docker" },
      { icon: "warn", warn: true, text: "neither one? leave the storage section out", at: "backend2:Without" },
    ],
  });

  ep.terminal({
    chapter: "Create the cluster",
    say: { id: "create", mood: "happy", cues: { place: "smug" }, gap: 0.4 },
    steps: [
      { cmd: "sind create cluster --config cluster.yaml", at: "create:Run" },
      { ff: "⏩ fast-forward", after: 0.5, hold: 1.6 },
      { prompt: true, at: "create:returns" },
    ],
  });

  ep.slide({
    chapter: "Work as a user",
    title: "Work as a user",
    say: { id: "asuser" },
    bullets: [
      { icon: "terminal", title: "sind ssh alice@submitter -- sbatch --wrap hostname", text: "alice submits a batch job on the submitter", at: "asuser:ssh" },
      { icon: "terminal", title: "sind exec --user alice -- squeue", text: "squeue as alice, on the submitter", at: "asuser:exec" },
      { icon: "terminal", title: "sind enter --user bob", text: "a shell as bob, in his home directory", at: "asuser:enter" },
    ],
  });
  [...ep.root.querySelectorAll(".scene-slide")].pop().classList.add("cmds");

  ep.diagram({
    chapter: "Under the hood",
    title: "The account tree",
    shot: "mini",
    say: [{ id: "tree" }, { id: "tree2", cues: { twice: "smug" } }],
    grid: [4, 4],
    nodes: [
      { id: "root", title: "root", text: "account", icon: "job", pos: [0, 1], at: "tree:tree" },
      { id: "physics", title: "physics", text: "GrpTRES=cpu=4", code: true, icon: "job", pos: [1, 1], width: 300, accent: true, at: "tree:tree+0.3" },
      { id: "bob", title: "bob", text: "default · coordinator", icon: "user", pos: [2, 0], width: 360, at: "tree:tree+0.6" },
      { id: "carol", title: "carol", text: "default · operator", icon: "user", pos: [2, 1], width: 360, at: "tree:tree+0.75" },
      { id: "theory", title: "theory", text: "MaxJobs=1", code: true, icon: "job", pos: [2, 2], width: 360, accent: true, at: "tree:tree+0.9" },
      { id: "alice", title: "alice", text: "default", icon: "user", pos: [3, 2], at: "tree:with" },
      { id: "bob2", title: "bob", icon: "user", pos: [3, 3], at: "tree:with+0.15" },
    ],
    edges: [
      { from: "root", to: "physics", at: "tree:tree+0.4" },
      { from: "physics", to: "bob", at: "tree:tree+0.7" },
      { from: "physics", to: "carol", at: "tree:tree+0.85" },
      { from: "physics", to: "theory", at: "tree:tree+1.0" },
      { from: "theory", to: "alice", at: "tree:with+0.1" },
      { from: "theory", to: "bob2", at: "tree:with+0.25" },
    ],
    pulse: [
      { node: "physics", at: "tree2:physics" },
      { node: "theory", at: "tree2:theory" },
      { node: "bob", at: "tree2:bob" },
      { node: "bob2", at: "tree2:twice" },
    ],
  });

  ep.slide({
    chapter: "Test the policy",
    title: "What this cluster tests",
    say: [{ id: "tests" }, { id: "cpus" }, { id: "davefail", mood: "smug", cues: { rejects: "concerned", job: "smug" } }],
    bullets: [
      { icon: "user", title: "alice: one job at a time", text: "MaxJobs=1 on theory", at: "tests:alice" },
      { icon: "nodes", title: "physics: 4 of 6 CPUs", text: "a job needing a fifth CPU pends: AssocGrpCpuLimit", at: "cpus:fifth" },
      { icon: "warn", title: "dave: rejected", text: "Invalid account or account/partition combination specified", at: "davefail:rejects" },
    ],
  });

  ep.slide({
    chapter: "Takeaways",
    title: "Takeaways",
    say: { id: "takeaway", cues: { CVMFS: "happy" } },
    bullets: [
      { icon: "job", title: "One file models your site", text: "nodes, limits, users, accounts and CVMFS", at: "takeaway:file" },
      { icon: "db", title: "Accounts need a db node", text: "and AccountingStorageEnforce for the limits", at: "takeaway:Accounts" },
      { icon: "disk", title: "CVMFS comes from the host", text: "or from a cvmfs Docker volume plugin", at: "takeaway:CVMFS" },
    ],
  });

  ep.outro({ chapter: "Wrap-up", next: "06 · Rehearse a change", say: "outro" }).done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
