<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Refresher: slurm.conf on one screen</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/avatars.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/avatars.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

  /* The kinds of lines: a label and a line from a generated file. */
  .lines { position: absolute; left: 120px; top: 290px; width: 1240px; display: flex; flex-direction: column; gap: 20px; }
  .lrow { display: flex; flex-direction: column; gap: 8px; padding: 16px 30px 18px; border-radius: 18px; background: rgba(30, 41, 59, 0.75); border: 2px solid var(--av-color-border); }
  .lk { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; color: var(--av-color-accent-soft); text-transform: uppercase; letter-spacing: 0.1em; }
  .lk i { width: 11px; height: 11px; border-radius: 3px; background: var(--av-color-accent); display: block; }
  .lv { font-family: "JetBrains Mono", monospace; font-size: 30px; color: #fff; white-space: pre; }
  .mk { border-radius: 6px; padding: 0 2px; margin: 0 -2px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Refresher: slurm.conf on one screen, embedded on docs/content/course/refreshers.md.
  // Its shortened cut is in course-06-rehearse-a-change. Every line of a Slurm
  // file on screen is copied whole from docs/content/architecture/slurm-config.md
  // (the slurm.conf baseline for `sind create cluster dev`, and sind-nodes.conf
  // for three workers with cpus: 2 and memory: 1g). The two files are two code
  // scenes; the line cards stay custom, as they label single lines from both
  // files and mark parts of a line, which a code panel cannot.
  const SERIES = "Refresher";
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const el = (html) => {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  // A custom slide: background, chapter label and title, Sindy in the corner.
  function frame(ep, kind, o) {
    const s = ep.custom(kind, { chapter: o.chapter, shot: "cornerR" });
    s.el.append(
      el('<div class="bg-glow"></div>'),
      el(`<div class="chapter"><span class="dot"></span>${SERIES}<b> · ${esc(o.label || o.chapter)}</b></div>`),
      el(`<div class="slide-title">${esc(o.title)}</div>`)
    );
    Scenes.enter(ep.tl, s.el.querySelector(".slide-title"), s.t + 0.5);
    return s;
  }

  // docs/content/architecture/slurm-config.md: the baseline for `sind create cluster dev`.
  const SLURM_CONF = [
    "# Generated by sind",
    "ClusterName=dev",
    "SlurmctldHost=controller",
    "SlurmUser=slurm",
    "StateSaveLocation=/var/spool/slurmctld",
    "SlurmdSpoolDir=/var/spool/slurmd",
    "PlugStackConfig=/etc/slurm/plugstack.conf",
    "",
    "ProctrackType=proctrack/cgroup",
    "TaskPlugin=task/cgroup",
    "MpiDefault=pmix",
    "ReturnToService=2",
    "DefMemPerCPU=512",
    "",
    "include /etc/slurm/sind-nodes.conf",
  ].join("\n");
  // Same page: sind-nodes.conf for three workers with cpus: 2 and memory: 1g.
  const NODES_CONF = [
    "# Generated by sind",
    "NodeName=worker-0 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "NodeName=worker-1 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "NodeName=worker-2 CPUs=2 RealMemory=1024 State=UNKNOWN",
    "PartitionName=all Nodes=worker-0,worker-1,worker-2 Default=YES",
  ].join("\n");
  // Lines `a` to `b` of a code panel, marked together.
  const block = (a, b, at, until) => Array.from({ length: b - a + 1 }, (_, i) => ({ panel: 0, line: a + i, at, until }));

  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "refresher-slurm-conf", title: "Refresher: slurm.conf on one screen", series: SERIES })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Refresher", title: "slurm.conf on one screen", say: "intro" })
    .talk({
      chapter: "One file, a few lines",
      kicker: "Refresher",
      title: "What defines a Slurm cluster?",
      sub: "The handful of slurm.conf lines that describe it, and how sind splits them.",
      chips: ["Controller", "Nodes", "Partitions"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [
        { id: "hook", mood: "thinking" },
        { id: "why", mood: "neutral", cues: { handful: "happy" } },
      ],
    });

  // ---- The lines that matter: one whole line from the docs for each kind ----
  {
    const s = frame(ep, "lines", { chapter: "The lines that matter", title: "The lines that define a cluster" });
    const rows = [
      { key: "Controller", html: "SlurmctldHost=controller" },
      { key: "Nodes", html: 'NodeName=worker-0 <span class="mk cpus">CPUs=2</span> <span class="mk mem">RealMemory=1024</span> State=UNKNOWN' },
      { key: "Partitions", html: 'PartitionName=all <span class="mk members">Nodes=worker-0,worker-1,worker-2</span> Default=YES' },
      { key: "Include", html: "include /etc/slurm/sind-nodes.conf" },
    ].map((r) => el(`<div class="lrow"><div class="lk"><i></i>${r.key}</div><div class="lv">${r.html}</div></div>`));
    const box = el('<div class="lines"></div>');
    box.append(...rows);
    s.el.append(box);
    ep.P.wait(0.6);
    ep.say([
      { id: "ctl", mood: "neutral" },
      { id: "nodes", mood: "neutral" },
      { id: "parts", mood: "neutral" },
      { id: "incl", mood: "neutral", cues: { right: "smug" } },
    ]);
    const T = ep.time;
    const ON = { borderColor: "#14b8a6", backgroundColor: "rgba(20, 184, 166, 0.16)" };
    const OFF = { borderColor: "#334155", backgroundColor: "rgba(30, 41, 59, 0.75)" };
    const focus = (row, at, until) => {
      tl.fromTo(row, OFF, Object.assign({ duration: 0.35 }, ON), at);
      if (until != null) tl.fromTo(row, ON, Object.assign({ duration: 0.35, immediateRender: false }, OFF), until);
    };
    const MK_ON = { backgroundColor: "rgba(94, 234, 212, 0.85)", color: "#0b1220" };
    const MK_OFF = { backgroundColor: "rgba(94, 234, 212, 0)", color: "#ffffff" };
    const mark = (q, at, until) => {
      const m = s.el.querySelectorAll(q);
      tl.fromTo(m, MK_OFF, Object.assign({ duration: 0.3 }, MK_ON), at);
      if (until != null) tl.fromTo(m, MK_ON, Object.assign({ duration: 0.3, immediateRender: false }, MK_OFF), until);
    };
    const cues = [T("ctl:SlurmctldHost"), T("nodes:NodeName"), T("parts:PartitionName"), T("incl:include")];
    rows.forEach((r, i) => {
      Scenes.enter(tl, r, cues[i] - 0.25, { y: 24 });
      focus(r, cues[i] - 0.1, i < 3 ? cues[i + 1] - 0.1 : null);
      ep.glance(cues[i], 0.9, -0.6, -0.15 + i * 0.1);
    });
    mark(".cpus", T("nodes:CPUs"), T("parts:PartitionName"));
    mark(".mem", T("nodes:memory"), T("parts:PartitionName"));
    mark(".members", T("parts:group"), T("incl:include"));
  }

  // ---- How sind splits it: slurm.conf includes sind-nodes.conf ----
  // The include line lights up as sind-nodes.conf fills in, and a note says
  // what it does.
  ep.code({
    chapter: "How sind splits it",
    wide: true,
    say: [
      { id: "split", mood: "neutral" },
      { id: "nodesfile", mood: "neutral" },
    ],
    panels: [
      { file: "slurm.conf", lang: "conf", text: SLURM_CONF },
      { file: "sind-nodes.conf", lang: "conf", text: NODES_CONF },
    ],
    reveal: [{ panel: 1, lines: [1, 5], at: "nodesfile:included" }],
    marks: [
      ...block(2, 7, "split:cluster", "split:ends"),
      ...block(9, 13, "split:cluster", "split:ends"),
      { panel: 0, text: "include", at: "split:ends", until: "nodesfile:NodeName" },
      { panel: 1, text: "NodeName=", at: "nodesfile:NodeName", until: "nodesfile:partition" },
      { panel: 1, text: "PartitionName=", at: "nodesfile:partition" },
    ],
    notes: [{ icon: "job", text: "include pulls in sind-nodes.conf, as if its lines stood there", at: "nodesfile:included" }],
  });
  // ---- Who writes what: sind rewrites sind-nodes.conf, your main section
  // goes before the include (a lit blank line before it marks the spot).
  ep.code({
    chapter: "Who writes what",
    wide: true,
    say: [
      { id: "rewrites", mood: "neutral", cues: { leaves: "smug" } },
      { id: "yours", mood: "happy" },
    ],
    panels: [
      { file: "slurm.conf", lang: "conf", text: SLURM_CONF },
      { file: "sind-nodes.conf", lang: "conf", text: NODES_CONF },
    ],
    marks: [
      ...Array.from({ length: 4 }, (_, i) => ({ panel: 1, line: 2 + i, at: "rewrites:rewrites", until: "rewrites:leaves" })),
      ...block(2, 7, "rewrites:leaves", "yours:Your"),
      ...block(9, 13, "rewrites:leaves", "yours:Your"),
      { panel: 0, line: 14, at: "yours:before" },
      { panel: 0, text: "include", at: "yours:include" },
    ],
    notes: [
      { icon: "nodes", text: "sind create worker and sind delete worker rewrite sind-nodes.conf", at: "rewrites:rewrites" },
      { icon: "gear", text: "your main section goes above the include", at: "yours:before" },
    ],
  });
  ep.slide({
    chapter: "Takeaways",
    title: "Takeaways",
    say: { id: "takeaway", mood: "happy" },
    bullets: [
      { icon: "server", title: "SlurmctldHost", text: "names the host the controller runs on", at: "takeaway:controller" },
      { icon: "nodes", title: "NodeName and PartitionName", text: "describe the nodes and group them into queues", at: "takeaway:partition" },
      { icon: "job", title: "include", text: "sind keeps its nodes in sind-nodes.conf", at: "takeaway:includes" },
    ],
  });

  ep.outro({ chapter: "Wrap-up", next: "06 · Rehearse a change", say: "outro" }).done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
