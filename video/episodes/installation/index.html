<head>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>

<script src="assets/voice/lines.js"></script>

<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Installation: docs/content/getting-started/installation.md. Commands are
  // copied from that page. The page shows no output for curl, gh attestation
  // verify or sind doctor, so they appear in a code panel as what you run, not
  // in a terminal; sind create cluster --pull is silent on success.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "installation", title: "Installation: one binary and a host check", series: "Installation" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Getting Started", title: "Installation", say: "intro" })
    .talk({
      chapter: "Get sind ready",
      kicker: "Getting Started",
      title: "Get sind ready",
      sub: "Install sind, verify the download, and let sind doctor check the host.",
      chips: ["amd64 · arm64", "Verified binary", "sind doctor"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "thinking", cues: { install: "happy" } },
    })
    .slide({
      chapter: "Three ways to install",
      title: "Three ways to install",
      say: { id: "ways", mood: "neutral" },
      bullets: [
        { icon: "terminal", title: "Pre-built binary", text: "linux/amd64 and linux/arm64, from the release", at: "ways:binary" },
        { icon: "gear", title: "mise", text: "installs and verifies the release binary", at: "ways:tool" },
        { icon: "job", title: "From source", text: "go install, with your Go toolchain", at: "ways:source" },
      ],
    })
    .code({
      chapter: "Download, verify, install",
      title: "Download, verify, install",
      wide: true,
      file: "what you run",
      lang: "sh",
      text: [
        "curl -fLO https://github.com/GSI-HPC/sind/releases/latest/download/sind-linux-amd64",
        "gh attestation verify sind-linux-amd64 --repo GSI-HPC/sind \\",
        "  --signer-workflow GSI-HPC/sind/.github/workflows/release.yml",
        "install -D ./sind-linux-amd64 ~/.local/bin/sind",
        "sind doctor",
      ].join("\n"),
      say: [
        { id: "dl", mood: "neutral" },
        { id: "verify", mood: "thinking", cues: { tells: "neutral", passes: "smug" } },
        { id: "install", mood: "happy", gap: 0.6 },
      ],
      reveal: [
        { lines: [1, 1], at: "dl:curl" },
        { lines: [2, 3], at: "verify:GitHub" },
        { lines: [4, 4], at: "install:Install" },
        { lines: [5, 5], at: "install:doctor" },
      ],
      marks: [
        { line: 1, at: "dl:curl", until: "verify:GitHub" },
        { line: 2, at: "verify:GitHub", until: "install:Install" },
        { line: 3, at: "verify:GitHub", until: "install:Install" },
        { line: 4, at: "install:Install", until: "install:doctor" },
        { line: 5, at: "install:doctor" },
      ],
      notes: [{ icon: "lock", text: "--signer-workflow matters: with --repo alone, any workflow of the repository would pass", at: "verify:only" }],
    })
    .slide({
      chapter: "What sind doctor checks",
      title: "What sind doctor checks",
      say: [
        { id: "doctor", mood: "neutral" },
        { id: "needs", mood: "happy", cues: { Desktop: "concerned" } },
      ],
      bullets: [
        { icon: "docker", title: "Docker Engine", text: "its version", at: "doctor:Docker" },
        { icon: "lock", title: "Daemon mode", text: "rootful, without userns-remap", at: "doctor:mode" },
        { icon: "host", title: "Where the daemon runs", text: "on this machine, not in a VM or on another host", at: "doctor:where" },
        { icon: "gear", title: "cgroup configuration", text: "with fix instructions if anything is missing", at: "doctor:cgroups" },
      ],
    })
    .terminal({
      chapter: "The node image",
      say: { id: "image", mood: "neutral", cues: { fresh: "happy" } },
      steps: [
        { cmd: "sind create cluster --pull", at: "image:Add" },
        { ff: "⏩ fast-forward", after: 0.5, hold: 1.6 },
        { prompt: true, after: 0.9 },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "take", mood: "happy" },
      bullets: [
        { icon: "lock", title: "Verify before you install", text: "gh attestation verify, with --signer-workflow", at: "take:verify" },
        { icon: "check", title: "sind doctor checks the host", text: "Docker version, daemon mode and host, cgroups", at: "take:doctor" },
        { icon: "docker", title: "Your first cluster pulls the image", text: "--pull fetches a fresh copy", at: "take:first" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Quickstart", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
