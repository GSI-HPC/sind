<!doctype html>
<html lang="en" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>sind refresher: Accounting and associations</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

  /* Slides whose bullet titles are commands or slurm.conf lines. */
  .cmds .bullet .t1 { font-family: "JetBrains Mono", monospace; font-size: 28px; font-weight: 400; }
  .mono-first .bullet:first-child .t1 { font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 400; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Refresher, Accounting and associations: docs/content/course/refreshers.md
  // (shortened in course/05-model-your-site.md). No terminal. The sacctmgr
  // lines are copied from docs/content/configuration/cluster-config.md
  // (Accounts section), the accounts, users and limits from guides/users.md,
  // MariaDB and slurmdbd on the db node from configuration/node-definitions.md;
  // the rest is well-established Slurm behaviour (job records, sacct,
  // associations, GrpTRES covering the accounts below, MaxJobs passed down to
  // the users, AccountingStorageEnforce).
  const tl = gsap.timeline({ paused: true });
  const ep = Episode.create({ tl, id: "refresher-accounting", title: "Refresher: Accounting and associations", series: "Refresher" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Refresher", title: "Accounting and associations", say: "intro" })
    .talk({
      chapter: "Who ran what, and who may",
      kicker: "Refresher",
      title: "Who ran what, and who may?",
      sub: "Job records, associations, and the limits that decide who may run.",
      chips: ["slurmdbd", "Associations", "Limits"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "hook", mood: "thinking" },
    })
    .diagram({
      chapter: "Job records",
      title: "Every job leaves a record",
      shot: "mini",
      say: [{ id: "records" }, { id: "sacct", cues: { even: "happy" } }],
      grid: [3, 2],
      nodeWidth: 300,
      nodes: [
        { id: "ctld", title: "slurmctld", text: "controller", icon: "server", pos: [-0.1, 0], width: 260, at: "records:slurmctld" },
        { id: "dbd", title: "slurmdbd", text: "accounting daemon", icon: "server", pos: [1, 0], width: 330, accent: true, at: "records:slurmdbd" },
        { id: "db", title: "MariaDB", text: "the database", icon: "db", pos: [2.1, 0], at: "records:database" },
        { id: "sacct", title: "sacct", text: "reads them back", icon: "terminal", pos: [1, 1], at: "sacct:sacct" },
      ],
      edges: [
        { from: "ctld", to: "dbd", label: "job records", at: "records:daemon" },
        { from: "dbd", to: "db", at: "records:MariaDB" },
        { from: "dbd", to: "sacct", at: "sacct:reads" },
      ],
      pulse: [{ node: "sacct", at: "sacct:finished" }],
    });

  ep.diagram({
    chapter: "Associations",
    title: "Users, accounts, associations",
    say: [{ id: "assoc" }, { id: "tree" }, { id: "limits" }, { id: "limits2", cues: { pass: "smug" } }],
    grid: [3, 2],
    nodes: [
      { id: "root", title: "root", text: "account", icon: "job", pos: [0, 0], at: "tree:root" },
      { id: "physics", title: "physics", text: "GrpTRES=cpu=4", code: true, icon: "job", pos: [1, 0], width: 300, at: "tree:tree" },
      { id: "theory", title: "theory", text: "MaxJobs=1", code: true, icon: "job", pos: [2, 0], width: 300, accent: true, at: "assoc:account" },
      { id: "bob", title: "bob", text: "physics · theory", icon: "user", pos: [1, 1], width: 300, at: "tree:user" },
      { id: "alice", title: "alice", text: "user", icon: "user", pos: [2, 1], at: "assoc:user" },
    ],
    groups: [{ id: "assoc", label: "association", around: ["theory", "alice"], accent: true, at: "assoc:cluster" }],
    edges: [
      { from: "alice", to: "theory", dashed: true, arrow: "none", at: "assoc:account+0.3" },
      { from: "physics", to: "theory", at: "tree:tree+0.3" },
      { from: "root", to: "physics", at: "tree:root+0.3" },
      { from: "bob", to: "physics", dashed: true, arrow: "none", at: "tree:user+0.3" },
    ],
    pulse: [
      { node: "bob", at: "tree:several" },
      { node: "theory", at: "limits:running" },
      { node: "physics", at: "limits:CPUs" },
      { node: "physics", at: "limits2:covers" },
      { node: "theory", at: "limits2:MaxJobs" },
      { node: "alice", at: "limits2:users" },
    ],
  });
  ep.slide({
    chapter: "sacctmgr",
    title: "sacctmgr manages them",
    say: { id: "sacctmgr", gap: 1.9 },
    bullets: [
      { icon: "terminal", title: "sacctmgr -i add account theory parent=physics MaxJobs=1", text: "an account below physics, with a job limit", at: "sacctmgr:manages" },
      { icon: "terminal", title: "sacctmgr -i add user alice account=theory defaultaccount=theory", text: "an association for alice, with her default account", at: "sacctmgr:users" },
    ],
  });
  [...ep.root.querySelectorAll(".scene-slide")].pop().classList.add("cmds");

  ep.slide({
    chapter: "Enforcement",
    title: "Make the limits bite",
    say: { id: "enforce", mood: "thinking", cues: { One: "neutral", applies: "happy" } },
    bullets: [
      { icon: "gear", title: "AccountingStorageEnforce=associations,limits", text: "one line in slurm.conf", at: "enforce:setting" },
      { icon: "lock", title: "associations", text: "no association, no job", at: "enforce:rejects" },
      { icon: "check", title: "limits", text: "the limits of every association apply", at: "enforce:applies" },
    ],
  });
  [...ep.root.querySelectorAll(".scene-slide")].pop().classList.add("mono-first");

  ep.slide({
    chapter: "Takeaways",
    title: "Takeaways",
    say: { id: "sum", cues: { count: "happy" } },
    bullets: [
      { icon: "db", title: "slurmdbd keeps the records", text: "sent by slurmctld, read back by sacct", at: "sum:records" },
      { icon: "user", title: "Associations link users to accounts", text: "on a cluster, and carry the limits", at: "sum:associations" },
      { icon: "lock", title: "Enforcement makes them count", text: "AccountingStorageEnforce in slurm.conf", at: "sum:enforcement" },
    ],
  });

  ep.outro({ chapter: "Wrap-up", next: "05 · Model your site", say: "outro" }).done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
