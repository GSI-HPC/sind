  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }

  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Power Control: docs/content/usage/power-control.md. Commands, the action
  // table and the SlurmdTimeout snippet are copied from that page (Examples,
  // Node failure detection); keep both in sync.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "power-control", title: "Power Control: crash, hang and reboot nodes", series: "Power Control" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Usage", title: "Power Control", say: "intro" })
    .talk({
      chapter: "Why break nodes",
      kicker: "Usage",
      title: "Simulate power events",
      sub: "Crash, shut down, reboot or freeze a node, and watch Slurm react.",
      chips: ["sind power", "freeze", "SlurmdTimeout"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "neutral", cues: { watch: "happy" }, look: { watch: "camera" } },
    })
    .slide({
      chapter: "Seven actions",
      title: "Each action is a Docker operation",
      say: [
        { id: "clean", mood: "neutral", cues: { plug: "concerned" } },
        { id: "start", mood: "neutral", cues: { stops: "thinking" } },
      ],
      bullets: [
        { icon: "gear", title: "shutdown · reboot", text: "docker stop: systemd shuts the node down cleanly", at: "clean:Shutdown" },
        { icon: "warn", title: "cut · cycle", text: "docker kill: an immediate SIGKILL", at: "clean:Cut" },
        { icon: "check", title: "on", text: "docker start, then fresh DNS records", at: "start:Power" },
        { icon: "lock", title: "freeze · unfreeze", text: "docker pause: running, but unresponsive", at: "start:freeze" },
      ],
    })
    .terminal({
      chapter: "Pull the plug",
      say: [
        { id: "cut", mood: "concerned", cues: { Say: "neutral" } },
        { id: "on", mood: "happy" },
        { id: "freeze", mood: "smug", cues: { ignores: "neutral" }, gap: 1.4 },
        { id: "thaw", mood: "happy" },
      ],
      steps: [
        { cmd: "sind power cut worker-[0-3]", at: "cut:Run" },
        { prompt: true, after: 0.6 },
        { cmd: "sind power on worker-[0-3]", at: "on:sind" },
        { prompt: true, after: 0.6 },
        { cmd: "sind power freeze worker-0", at: "freeze:freeze" },
        { prompt: true, after: 0.5 },
        { ff: "⏩ fast-forward", at: "freeze:alike+0.5", hold: 1.6 },
        { cmd: "sind power unfreeze worker-0", at: "thaw:unfreeze" },
        { prompt: true, after: 0.6 },
      ],
    })
    .diagram({
      chapter: "How Slurm notices",
      title: "How Slurm notices",
      shot: "mini",
      say: [
        { id: "notice", mood: "neutral", cues: { down: "concerned" } },
        { id: "back", mood: "neutral", cues: { itself: "happy" } },
      ],
      grid: [3, 2],
      nodeWidth: 310,
      nodes: [
        { id: "idle", title: "idle", text: "worker-0 in service", icon: "check", pos: [-0.18, 0], at: "notice:lost" },
        { id: "star", title: "idle*", text: "a ping failed", icon: "warn", pos: [1, 0], at: "notice:idle" },
        { id: "down", title: "DOWN", text: "about 5 min later", icon: "warn", pos: [2.18, 0], at: "notice:down" },
        { id: "reg", title: "slurmd registers", text: "ReturnToService=2", code: true, icon: "server", ghost: true, width: 400, pos: [1, 1], at: "back:registers" },
      ],
      edges: [
        { from: "idle", to: "star", label: "no answer", at: "notice:pings" },
        { from: "star", to: "down", label: "SlurmdTimeout", at: "notice:later" },
        { from: "down", to: "reg", accent: true, dashed: true, at: "back:again" },
        { from: "reg", to: "idle", accent: true, dashed: true, at: "back:returns" },
      ],
      pulse: [
        { node: "star", at: "notice:star" },
        { node: "down", at: "notice:minutes" },
        { node: "idle", at: "back:service" },
      ],
    })
    .code({
      chapter: "Faster failure tests",
      title: "Lower SlurmdTimeout",
      file: "cluster config",
      lang: "yaml",
      text: ["slurm:", "  main: |", "    SlurmdTimeout=30"].join("\n"),
      say: [
        { id: "fast", mood: "thinking", cues: { shorter: "smug" } },
        { id: "fast2", mood: "happy" },
      ],
      marks: [{ text: "SlurmdTimeout=30", at: "fast:shorter" }],
      notes: [
        { icon: "warn", text: "Default: SlurmdTimeout=300, DOWN after about five minutes", at: "fast:Five" },
        { icon: "check", text: "With 30: DOWN within about 30 to 40 s", at: "fast2:within" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "take", mood: "happy" },
      bullets: [
        { icon: "docker", title: "Each action is a Docker call", text: "docker stop, kill, start or pause", at: "take:power" },
        { icon: "warn", title: "Lost nodes go idle*, then DOWN", text: "Slurm notices only when pings fail", at: "take:pings" },
        { icon: "gear", title: "Lower SlurmdTimeout for tests", text: "30 s instead of the default 300", at: "take:timeout" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Diagnostics", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
