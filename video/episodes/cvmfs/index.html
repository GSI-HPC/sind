<script src="vendor/gsap.min.js"></script>

<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Using CVMFS: docs/content/guides/cvmfs.md. Both cluster configs, the
  // commands and the findmnt output are copied from that page; keep both in
  // sync.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "cvmfs", title: "Using CVMFS: software from /cvmfs on every node", series: "Using CVMFS" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Guides", title: "Using CVMFS", say: "intro" })
    .talk({
      chapter: "Software from /cvmfs",
      kicker: "Guides",
      title: "Software from /cvmfs",
      sub: "Mount CVMFS on every node, or test the tooling that provisions its client.",
      chips: ["/cvmfs on every node", "Two use cases"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: { id: "why", mood: "thinking" },
    })
    .slide({
      chapter: "Two use cases",
      title: "Two use cases",
      say: { id: "cases", mood: "neutral" },
      bullets: [
        { icon: "disk", title: "Consume CVMFS", text: "jobs read software from /cvmfs", at: "cases:Consume" },
        { icon: "gear", title: "Provision CVMFS", text: "test the tooling that installs the client", at: "cases:provision" },
      ],
    })
    .code({
      chapter: "Mount CVMFS on the nodes",
      file: "cluster.yaml",
      lang: "yaml",
      font: 38,
      text: ["kind: Cluster", "name: dev", "storage:", "  cvmfs: true", "nodes:", "  - controller", "  - submitter", "  - worker: 2"].join("\n"),
      say: [{ id: "config", cues: { privileges: "happy" } }],
      marks: [
        { text: "storage:", at: "config:storage" },
        { text: "cvmfs: true", at: "config:cvmfs" },
      ],
      notes: [{ icon: "check", text: "no extra privileges on the nodes", at: "config:privileges" }],
    })
    .terminal({
      chapter: "Check the host, create the cluster",
      say: [
        { id: "host", mood: "neutral", cues: { shared: "happy" } },
        { id: "create", mood: "happy" },
        { id: "early", mood: "neutral", cues: { early: "smug" } },
      ],
      steps: [
        { cmd: "findmnt -o TARGET,PROPAGATION /cvmfs", at: "host:check" },
        { out: "TARGET PROPAGATION\n/cvmfs shared", at: "host:Here" },
        { mark: "shared", at: "host:shared" },
        { cmd: "sind create cluster --config cluster.yaml", at: "create:create" },
        { ff: "⏩ fast-forward", at: "early:tries", hold: 1.6 },
        { prompt: true, at: "early:fails" },
      ],
    })
    .diagram({
      chapter: "Two backends",
      title: "sind picks the backend",
      shot: "mini",
      say: [
        { id: "backends", mood: "neutral" },
        { id: "mount", mood: "neutral", cues: { configure: "happy" } },
      ],
      grid: [5, 3],
      nodes: [
        { id: "plugin", title: "Volume plugin", text: "named cvmfs", icon: "docker", pos: [1, 0], width: 340, at: "backends:plugin" },
        { id: "host", title: "Host /cvmfs", text: "bind mount", icon: "host", pos: [3, 0], width: 340, at: "backends:host" },
        { id: "ctl", title: "controller", text: "/cvmfs", code: true, icon: "server", pos: [0, 2], at: "backends:picks" },
        { id: "sub", title: "submitter", text: "/cvmfs", code: true, icon: "nodes", pos: [1, 2], at: "backends:picks+0.12" },
        { id: "w0", title: "worker-0", text: "/cvmfs", code: true, icon: "nodes", pos: [2, 2], at: "backends:picks+0.24" },
        { id: "w1", title: "worker-1", text: "/cvmfs", code: true, icon: "nodes", pos: [3, 2], at: "backends:picks+0.36" },
        { id: "w2", title: "worker-2", text: "added later", icon: "nodes", pos: [4, 2], ghost: true, at: "mount:later" },
      ],
      groups: [{ id: "dev", label: "cluster dev · read-only", around: ["ctl", "sub", "w0", "w1", "w2"], at: "backends:picks" }],
      edges: [
        { from: "plugin", to: "dev", label: "if installed", at: "backends:installed" },
        { from: "host", to: "dev", label: "otherwise", dashed: true, at: "backends:host+0.2" },
      ],
      pulse: [
        { node: "ctl", at: "mount:Every" },
        { node: "sub", at: "mount:Every+0.1" },
        { node: "w0", at: "mount:Every+0.2" },
        { node: "w1", at: "mount:Every+0.3" },
      ],
    })
    .code({
      chapter: "Provision CVMFS inside the nodes",
      file: "cvmfs.yaml",
      lang: "yaml",
      text: [
        "kind: Cluster",
        "name: cvmfs",
        "nodes:",
        "  - role: controller",
        "  - role: submitter",
        "    capAdd: [SYS_ADMIN]",
        "    devices: [/dev/fuse]",
        "    securityOpt: [apparmor=unconfined]  # AppArmor hosts only (Ubuntu, Debian)",
        "  - role: worker",
        "    capAdd: [SYS_ADMIN]",
        "    devices: [/dev/fuse]",
        "    securityOpt: [apparmor=unconfined]",
      ].join("\n"),
      say: [{ id: "provision" }, { id: "privs", cues: { unconfined: "concerned" } }],
      marks: [
        { text: "capAdd", at: "privs:capability" },
        { text: "devices", at: "privs:fuse" },
        { text: "securityOpt", at: "privs:unconfined" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "takeaway", cues: { inside: "happy" } },
      bullets: [
        { icon: "disk", title: "storage.cvmfs: true", text: "CVMFS on every node, even workers added later", at: "takeaway:setting" },
        { icon: "check", title: "sind picks the backend", text: "a volume plugin, else the host's /cvmfs", at: "takeaway:picks" },
        { icon: "gear", title: "Provisioning tests", text: "the client inside the nodes, with SYS_ADMIN and /dev/fuse", at: "takeaway:provisioning" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "Users and Identity", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
