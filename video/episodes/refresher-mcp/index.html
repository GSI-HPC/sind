<script src="vendor/gsap.min.js"></script>
<script src="vendor/sindy.js"></script>
<script src="vendor/scenes.js"></script>
<script src="vendor/episode.js"></script>
<script src="assets/voice/lines.js"></script>
<link rel="stylesheet" href="vendor/scenes.css" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700 800; src: url("vendor/fonts/inter-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("vendor/fonts/jetbrains-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-700.woff2") format("woff2"); }

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080"></div>
<script>
  // Refresher: What MCP is, embedded on docs/content/course/refreshers.md and
  // cut down in course-10-assistant. No terminal: the MCP background is
  // general knowledge, and the sind specifics (stdio needs no token, HTTP
  // needs a bearer token, tools say whether they are read-only) come from
  // docs/content/guides/mcp.md.
  const tl = gsap.timeline({ paused: true });
  Episode.create({ tl, id: "refresher-mcp", title: "Refresher: What MCP is", series: "Refresher" })
    .intro({ chapter: "Hi, I'm Sindy", kicker: "Refresher", title: "What MCP is", say: "intro" })
    .talk({
      chapter: "Why it matters",
      kicker: "Refresher",
      title: "How does an assistant run a tool?",
      sub: "The Model Context Protocol connects AI assistants to the tools they can use.",
      chips: ["Client", "Server", "Tools"],
      nameTag: { name: "Sindy", role: "your sind guide" },
      say: [{ id: "hook", mood: "thinking" }, { id: "why2", mood: "neutral", cues: { MCP: "smug" } }],
    })
    .diagram({
      chapter: "Clients and servers",
      title: "Clients and servers",
      say: { id: "roles", mood: "neutral" },
      grid: [3, 2],
      nodes: [
        { id: "ai", title: "Assistant", text: "MCP client", icon: "user", pos: [0, 0.5], at: "roles:assistant" },
        { id: "sind", title: "sind", text: "MCP server", icon: "server", pos: [1, 0], accent: true, at: "roles:connects" },
        { id: "more", title: "More servers", text: "each with tools", icon: "server", pos: [1, 1], width: 300, ghost: true, at: "roles:connects+0.3" },
      ],
      edges: [
        { from: "ai", to: "sind", arrow: "both", at: "roles:servers" },
        { from: "ai", to: "more", arrow: "both", dashed: true, at: "roles:servers+0.3" },
      ],
      pulse: [{ node: "more", at: "roles:own" }],
    })
    .diagram({
      chapter: "Tools describe themselves",
      title: "Tools describe themselves",
      say: [
        { id: "list", mood: "neutral" },
        { id: "hints", mood: "neutral", cues: { ask: "happy" } },
      ],
      grid: [3, 2],
      nodes: [
        { id: "ai", title: "Assistant", text: "MCP client", icon: "user", pos: [0, 0.5] },
        { id: "sind", title: "sind", text: "MCP server", icon: "server", pos: [1, 0], accent: true },
        { id: "more", title: "More servers", text: "each with tools", icon: "server", pos: [1, 1], width: 300, ghost: true },
        { id: "tool", title: "Each tool", text: "name · description · arguments", icon: "job", pos: [2, 0], width: 440, at: "list:name" },
        { id: "hint", title: "Read or change?", text: "read-only or destructive", icon: "lock", pos: [2, 1], width: 440, at: "hints:reads" },
      ],
      edges: [
        { from: "ai", to: "sind", arrow: "both" },
        { from: "ai", to: "more", arrow: "both", dashed: true },
        { from: "sind", to: "tool", at: "list:name+0.3" },
        { from: "sind", to: "hint", dashed: true, at: "hints:reads+0.3" },
      ],
      pulse: [{ node: "sind", at: "list:asks" }],
    })
    .diagram({
      chapter: "A tool call",
      title: "One tool call",
      say: [
        { id: "ask", mood: "neutral", cues: { decides: "thinking" } },
        { id: "approve", mood: "neutral" },
        { id: "run", mood: "neutral", cues: { result: "happy" } },
      ],
      grid: [3, 2],
      nodes: [
        { id: "you", title: "You", icon: "user", pos: [0, 0], ghost: true, at: "ask:ask" },
        { id: "ai", title: "Assistant", text: "model + client", icon: "user", pos: [0, 1], at: "ask:ask" },
        { id: "srv", title: "Server", text: "runs the tool", icon: "server", pos: [2, 1], accent: true, at: "ask:picks" },
      ],
      edges: [
        { from: "you", to: "ai", label: "request", bend: 160, accent: true, at: "ask:ask+0.3" },
        { from: "ai", to: "you", label: "approve?", bend: 160, at: "approve:show" },
        { from: "ai", to: "srv", label: "call", accent: true, at: "run:server" },
        { from: "srv", to: "ai", label: "result", bend: 140, at: "run:result" },
      ],
      pulse: [
        { node: "ai", at: "ask:decides" },
        { node: "you", at: "approve:approval" },
        { node: "ai", at: "run:answer" },
      ],
    })
    .slide({
      chapter: "Two transports",
      title: "Two ways to talk",
      say: [{ id: "stdio", mood: "neutral" }, { id: "http", mood: "neutral", cues: { token: "smug" } }],
      bullets: [
        { icon: "terminal", title: "Standard input and output", text: "the client starts the server · sind mcp start", at: "stdio:standard" },
        { icon: "globe", title: "HTTP", text: "the server listens on a port · sind mcp stream · bearer token", at: "http:HTTP" },
      ],
    })
    .slide({
      chapter: "Takeaways",
      title: "Takeaways",
      say: { id: "take", mood: "happy" },
      bullets: [
        { icon: "job", title: "Servers describe their tools", text: "name, description, arguments, and whether they change things", at: "take:describe" },
        { icon: "user", title: "The client can ask you first", text: "it shows the call and waits for your approval", at: "take:ask" },
        { icon: "lock", title: "Standard input and output, or HTTP", text: "over HTTP, sind wants a bearer token", at: "take:HTTP" },
      ],
    })
    .outro({ chapter: "Wrap-up", next: "10 · Let your assistant drive", say: "outro" })
    .done();
  window.__timelines["main"] = tl;
</script>
</body>
</html>
