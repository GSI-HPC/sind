name: CI

# Pushes to main and next test the merged result and write the image build
# cache that pull requests read: a pull request run restores caches only
# from its own ref, its base branch and the default branch.
on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the commit it replaces.
# Runs of pushes to a branch always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # The files behind //go:build integration, which the run above
      # leaves out, as it leaves out those behind !integration.
      - name: Lint the integration build
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration

  # actionlint on the workflows, with shellcheck on their run steps,
  # shellcheck on the scripts of the repository, and zizmor on the workflows
  # and the Dependabot config for security defects, such as an expression
  # of the event in a run step or an action that is not pinned. The image
  # and the nightly workflows do not run for a pull request, so this is
  # their only check before the merge.
  lint-ci:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint the workflows and the shell scripts
        run: make lint-ci

      - name: Install zizmor
        run: pipx install zizmor==1.32.0

      # With the token, zizmor also asks GitHub about each action that the
      # workflows use: known vulnerabilities, and the commit behind a pin.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: make audit-ci

  # TLC on the TLA+ models of spec/tla: each configuration must give the
  # result that it expects. The runner image has Java; the script fetches
  # the release of the TLA+ tools that it pins and checks its sha256.
  models:
    name: Design Models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the models
        run: make check-models

  # markdownlint-cli2 on docs/content, at the version that the Makefile
  # pins and with the rules of .markdownlint.json, on the runner's Node.
  lint-docs:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the docs
        run: make lint-docs

  # Hugo builds the site as the Deploy docs workflow does after the merge,
  # so that a broken shortcode, template or page reference (relref) fails
  # on the pull request and not on the site of next. A script then checks
  # each link of the site into the site: its page, and the element of its
  # fragment. The build makes no videos and no screenshots: their
  # shortcodes show nothing, or a box, without them. The Hugo version is
  # the one of docs.yml.
  check-docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hugo fetches the Hextra theme, a Hugo module, with Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.169.0"

      - name: Build the docs
        run: make check-docs

  # The pages of sind ui in a browser: tools/screenshots opens each shot of
  # its list on the demo, in both themes, and fails when a page reports an
  # exception, a console.error, a request that fails or a response with a
  # status of 400 or more. It writes no image: the Deploy docs workflow
  # takes the screenshots after the merge, and fails on the same faults.
  # Then it opens 8 tabs at once, 6 of them hidden: each must show its page.
  check-ui:
    name: UI Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The runner's Node.
      - name: Test the page scripts
        run: make test-js

      # The runner's Chrome; -no-sandbox as the runner's AppArmor may refuse
      # the user namespaces of its sandbox.
      - name: Open the pages of sind ui
        run: make check-ui SHOTS_FLAGS=-no-sandbox

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/test-reporter publishes the results as a check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install firejail
        run: sudo apt-get update && sudo apt-get install -y firejail

      # Prime the module cache outside the sandbox — firejail breaks DNS
      # resolution, so `go test` must find every dependency pre-cached.
      - name: Prime module cache
        run: go mod download

      # One run, in the sandbox, writes the test report and the coverage
      # profile that Unit Test Coverage checks.
      - name: Unit tests
        run: make test
        env:
          GOTEST: gotestsum --junitfile unit-tests.xml -- -coverprofile=coverage.out

      - name: Test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Unit Test Results
          path: unit-tests.xml
          reporter: java-junit

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

      # tools/screenshots is a module of its own, which ./... leaves out.
      # Its tests check the shot list that the docs use.
      - name: Screenshot tool tests
        working-directory: tools/screenshots
        run: go vet ./... && go test ./...

  unit-test-coverage:
    name: Unit Test Coverage
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          config: .testcoverage.yml

  # govulncheck reports known vulnerabilities in the Go dependencies and
  # the standard library, and fails only on those in code sind calls.
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The go line of go.mod is the oldest Go a library caller may build sind
  # with; the toolchain line, which the other jobs use, does not reach
  # them. Build and vet the public packages, tests included, with it.
  oldest-go:
    name: Oldest Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build and vet pkg/ with the go line of go.mod
        run: |
          GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)
          export GOTOOLCHAIN
          go version
          go build ./pkg/...
          go vet ./pkg/...

  image-targets:
    name: Image Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One bake target per Slurm release line (SLURM_RELEASES in
      # docker-bake.hcl), once per platform.
      - name: List node image targets
        id: targets
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          fields: platforms

  integration-test-image:
    name: Integration Test (${{ matrix.target }}, ${{ matrix.platforms }})
    needs: image-targets
    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # dorny/test-reporter publishes the results as a check run.
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The Ubuntu 26.04 runner image allows 128 inotify instances per user.
      # The test clusters that run in parallel take more: systemd in the
      # next node container then fails to start, and the container exits
      # with code 255 (docs/content/troubleshooting/container-exit-255.md).
      # It prints the runner's limit first, as the docs cite it.
      - name: Raise the inotify instance limit
        run: |
          sysctl fs.inotify.max_user_instances
          sudo sysctl -w fs.inotify.max_user_instances=8192

      # The integration tests fail when the host lacks sind's prerequisites,
      # under SIND_TEST_REQUIRE_DOCKER; fail here first, with sind's own
      # words. inotify is only a warning for sind, but the tests need it to
      # pass.
      - name: Check prerequisites
        run: |
          go run ./cmd/sind doctor
          go run ./cmd/sind doctor -o json |
            jq -e '.[] | select(.name == "inotify") | .status == "ok"' >/dev/null ||
            { echo "::error::sind doctor: the inotify check does not pass"; exit 1; }

      # The builder's BuildKit image comes from Docker Hub by default; take it
      # from Google's mirror for the same reason as the tests' images below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build sind-node image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          targets: ${{ matrix.target }}
          load: true
          allow: network.host
          set: |
            *.platform=${{ matrix.platforms }}
            *.cache-from=type=gha,scope=${{ matrix.target }}-${{ runner.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-${{ runner.arch }}
            *.tags=local/sind-node:ci

      # The mesh's SSH relay runs sind's default node image, which is
      # sind-node:latest for the test binaries. Tag the image under test as
      # it, so the relay runs that image and nothing is pulled.
      - name: Use the image under test for the SSH relay
        run: docker tag local/sind-node:ci ghcr.io/gsi-hpc/sind-node:latest

      # Docker Hub rate-limits anonymous pulls per IP, which the runners
      # share, and then refuses the Docker Hub images the tests run, the
      # mesh's CoreDNS and the monitoring stack's four, which
      # tools/images prints, and busybox, with toomanyrequests. A
      # registry-mirrors entry in daemon.json was not used for those pulls,
      # so pull them from Google's mirror of Docker Hub and tag them with
      # their Docker Hub names: present locally, nothing pulls them again.
      - name: Pull the tests' Docker Hub images from mirror.gcr.io
        run: |
          images=$(go run ./tools/images)
          # shellcheck disable=SC2086 # one word per image
          for image in $images busybox:latest; do
            case "$image" in
              */*) path=$image ;;
              *) path=library/$image ;;
            esac
            docker pull "mirror.gcr.io/$path"
            docker tag "mirror.gcr.io/$path" "$image"
          done

      # The CVMFS guide (docs/content/guides/cvmfs.md) cites the hard limit
      # on open files in a container on GitHub's runners.
      - name: Show the open files limit of a container
        run: docker run --rm busybox:latest sh -c 'echo "soft $(ulimit -Sn), hard $(ulimit -Hn)"'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Integration tests
        run: make test-integration
        env:
          SIND_TEST_IMAGE: local/sind-node:ci
          SIND_TEST_REQUIRE_DOCKER: "1"
          GOTEST: gotestsum --junitfile integration-tests.xml --

      # A test removes what it made, and so does sind: after a suite that
      # passed, Docker holds nothing with a sind label. A leftover is a
      # test without cleanup, or a delete that leaves a resource behind.
      - name: Check for leftover sind resources
        run: |
          left=$(
            docker ps -a --filter label=sind.realm --format 'container {{.Names}}'
            docker network ls --filter label=sind.realm --format 'network {{.Name}}'
            docker volume ls --filter label=sind.realm --format 'volume {{.Name}}'
          )
          if [[ -n "$left" ]]; then
            echo "::error::the integration tests left sind resources behind"
            echo "$left"
            exit 1
          fi

      - name: Test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Integration Test Results (${{ matrix.target }}, ${{ matrix.platforms }})
          path: integration-tests.xml
          reporter: java-junit

  # Single check over all release lines and platforms, so its name stays
  # stable when SLURM_RELEASES or the platforms change. Skipped in a
  # cancelled run, so a superseded commit gets no failed check.
  integration-test:
    name: Integration Test
    needs: integration-test-image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check integration test results
        env:
          RESULT: ${{ needs.integration-test-image.result }}
        run: '[[ "$RESULT" == success ]]'

  release-snapshot:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The release build (.goreleaser.yaml) for every platform, without
      # publishing, so a broken config fails here instead of at release.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean
