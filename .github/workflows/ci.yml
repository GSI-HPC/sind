name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Install firejail
        run: sudo apt-get update && sudo apt-get install -y firejail

      # Prime the module cache outside the sandbox — firejail breaks DNS
      # resolution, so `go test` must find every dependency pre-cached.
      - name: Prime module cache
        run: go mod download

      - name: Unit tests
        run: make test
        env:
          GOTEST: gotestsum --junitfile unit-tests.xml --

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Test Results
          path: unit-tests.xml
          reporter: java-junit

  unit-test-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate coverage profile
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml

  image-targets:
    name: Image Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # One bake target per Slurm release line (SLURM_RELEASES in
      # docker-bake.hcl).
      - name: List node image targets
        id: targets
        uses: docker/bake-action/subaction/matrix@v7

  integration-test-image:
    name: Integration Test (${{ matrix.target }})
    needs: image-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v4

      - name: Build sind-node image
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          load: true
          allow: network.host
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
            *.tags=local/sind-node:ci

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Integration tests
        run: make test-integration
        env:
          SIND_TEST_IMAGE: local/sind-node:ci
          GOTEST: gotestsum --junitfile integration-tests.xml --

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Integration Test Results (${{ matrix.target }})
          path: integration-tests.xml
          reporter: java-junit

  # Single check over all release lines, so its name stays stable when
  # SLURM_RELEASES changes.
  integration-test:
    name: Integration Test
    needs: integration-test-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check integration test results
        env:
          RESULT: ${{ needs.integration-test-image.result }}
        run: '[[ "$RESULT" == success ]]'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: sind-linux-amd64
          path: sind-linux-amd64

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The release build (.goreleaser.yaml) for every platform, without
      # publishing, so a broken config fails here instead of at release.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
