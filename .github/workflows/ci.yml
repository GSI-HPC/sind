name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the commit it replaces.
# Runs of pushes to a branch always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/test-reporter publishes the results as a check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install firejail
        run: sudo apt-get update && sudo apt-get install -y firejail

      # Prime the module cache outside the sandbox — firejail breaks DNS
      # resolution, so `go test` must find every dependency pre-cached.
      - name: Prime module cache
        run: go mod download

      - name: Unit tests
        run: make test
        env:
          GOTEST: gotestsum --junitfile unit-tests.xml --

      - name: Test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Unit Test Results
          path: unit-tests.xml
          reporter: java-junit

  unit-test-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate coverage profile
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@f484eec846448c97c777a26f8b58c5a69a327e12 # v2.20.0
        with:
          config: .testcoverage.yml

  image-targets:
    name: Image Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One bake target per Slurm release line (SLURM_RELEASES in
      # docker-bake.hcl), once per platform.
      - name: List node image targets
        id: targets
        uses: docker/bake-action/subaction/matrix@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          fields: platforms

  integration-test-image:
    name: Integration Test (${{ matrix.target }}, ${{ matrix.platforms }})
    needs: image-targets
    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # dorny/test-reporter publishes the results as a check run.
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The integration tests skip when the host lacks sind's prerequisites;
      # fail here instead so a runner change cannot turn this job green.
      - name: Check prerequisites
        run: go run ./cmd/sind doctor

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build sind-node image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: ${{ matrix.target }}
          load: true
          allow: network.host
          set: |
            *.platform=${{ matrix.platforms }}
            *.cache-from=type=gha,scope=${{ matrix.target }}-${{ runner.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-${{ runner.arch }}
            *.tags=local/sind-node:ci

      # The mesh's SSH relay runs sind-node:latest, which Docker only pulls
      # when missing. Use the image under test so it matches this platform.
      - name: Use the image under test for the SSH relay
        run: docker tag local/sind-node:ci ghcr.io/gsi-hpc/sind-node:latest

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Integration tests
        run: make test-integration
        env:
          SIND_TEST_IMAGE: local/sind-node:ci
          GOTEST: gotestsum --junitfile integration-tests.xml --

      - name: Test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Integration Test Results (${{ matrix.target }}, ${{ matrix.platforms }})
          path: integration-tests.xml
          reporter: java-junit

  # Single check over all release lines and platforms, so its name stays
  # stable when SLURM_RELEASES or the platforms change. Skipped in a
  # cancelled run, so a superseded commit gets no failed check.
  integration-test:
    name: Integration Test
    needs: integration-test-image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check integration test results
        env:
          RESULT: ${{ needs.integration-test-image.result }}
        run: '[[ "$RESULT" == success ]]'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sind-linux-amd64
          path: sind-linux-amd64

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The release build (.goreleaser.yaml) for every platform, without
      # publishing, so a broken config fails here instead of at release.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean
