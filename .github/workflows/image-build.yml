name: Image build

# Builds the sind-node images of one commit, each platform on a native
# runner, tests each of them, and publishes them under the tags
# docker-bake.hcl sets. Called by the image workflow (image.yml).
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        required: true
        type: string
      release:
        description: >-
          sind release (vX.Y.Z) to tag the images for, as vX.Y.Z-<YY>.<MM>
          and vX.Y.Z; empty for <version>, <YY>.<MM> and latest
        required: false
        type: string
        default: ""
      refresh:
        description: >-
          Rebuild the runtime stage without the cache, so its packages are
          current; the compiled components still come from the cache
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gsi-hpc/sind-node
  # docker-bake.hcl chooses the tags by it.
  SIND_RELEASE: ${{ inputs.release }}

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
      builds: ${{ steps.builds.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # One bake target per Slurm release line (SLURM_RELEASES in
      # docker-bake.hcl). The bake file also sets the tags, including
      # latest or vX.Y.Z on the newest release line.
      - name: List node image targets
        id: targets
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0

      - name: List builds per platform
        id: builds
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          fields: platforms

      - name: List the platforms
        id: platforms
        env:
          BUILDS: ${{ steps.builds.outputs.matrix }}
        run: echo "platforms=$(jq -c '[.[].platforms] | unique' <<<"$BUILDS")" >> "$GITHUB_OUTPUT"

  # Every target of a platform in one build on a native runner (compiling
  # the image under emulation would take hours). The release lines then
  # build the layers they share, all up to the Slurm COPY, once and publish
  # them as the same blobs, so a host that pulls several lines downloads
  # those layers once.
  build:
    name: build (${{ matrix.platform }})
    needs: targets
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.targets.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each target has its own cache scope, apart from the CI's, so test
      # runs cannot feed layers into the published images. Release builds
      # read main's cache but do not write it, so a rebuild of an older
      # release does not replace it.
      - name: Cache settings
        id: cache
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          WRITE: ${{ inputs.release == '' }}
        run: |
          {
            echo "set<<EOF"
            jq -r --arg arch "$RUNNER_ARCH" --argjson write "$WRITE" '.[].target |
              "\(.).cache-from=type=gha,scope=image-\(.)-\($arch)",
              (if $write then "\(.).cache-to=type=gha,mode=max,scope=image-\(.)-\($arch)" else empty end)' <<<"$TARGETS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Push untagged; the merge jobs tag the multi-platform images, once
      # the test jobs have passed them.
      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # docker-bake.hcl then builds the runtime stage without the cache.
          REFRESH_PACKAGES: ${{ inputs.refresh }}
        with:
          allow: network.host
          set: |
            *.platform=${{ matrix.platform }}
            *.tags=${{ env.IMAGE }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true
            ${{ steps.cache.outputs.set }}

      # Read bake's metadata file, not steps.bake.outputs.metadata: with max
      # provenance it embeds the GitHub event once per target and outgrows the
      # 128 KiB limit for one environment variable ("Argument list too long").
      - name: Export digests
        run: |
          metadata=$(find "$RUNNER_TEMP" -path '*/docker-actions-toolkit-*/bake-metadata-*.json' | head -n 1)
          test -n "$metadata" || { echo "::error::bake metadata file not found"; exit 1; }
          jq -r 'to_entries[] | select((.value | type) == "object" and (.value | has("containerimage.digest")))
            | "\(.key) \(.value["containerimage.digest"])"' "$metadata" |
            while read -r target digest; do
              mkdir -p "$RUNNER_TEMP/digests/$target"
              touch "$RUNNER_TEMP/digests/$target/${digest#sha256:}"
            done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ runner.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # Each image that the build pushed, on a native runner, before the merge
  # job gives it tags: a weekly rebuild takes new Rocky Linux packages into
  # the runtime stage, which no pull request tested. The tests are those of
  # the commit that is built, so a release's images run the tests of that
  # release: a cluster through the CLI as the quickstart guide has it, a
  # cluster through the library, an MPI job, and accounting, which needs
  # the image's MariaDB. An image that fails them stays untagged.
  test:
    name: test (${{ matrix.target }}, ${{ matrix.platforms }})
    needs: [targets, build]
    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.builds) }}
    env:
      TESTS: ^(TestQuickstart|TestMPI|TestClusterCreateDeleteLifecycle|TestDBNodeAccounting)$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ runner.arch }}
          path: ${{ runner.temp }}/digests

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tests run the image under the name SIND_TEST_IMAGE gives them;
      # the mesh's SSH relay runs sind's default node image, which is
      # sind-node:latest for the test binaries. Both names are local tags of
      # the digest under test, so nothing pulls the published latest.
      - name: Pull the image under test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          digests=("$RUNNER_TEMP/digests/$TARGET"/*)
          if [[ ${#digests[@]} -ne 1 || ! -f "${digests[0]}" ]]; then
            echo "::error::expected one digest of $TARGET for $RUNNER_ARCH, found: ${digests[*]}"
            exit 1
          fi
          image="$IMAGE@sha256:$(basename "${digests[0]}")"
          docker pull "$image"
          docker tag "$image" local/sind-node:ci
          docker tag "$image" "$IMAGE:latest"

      # As for the integration tests of CI (ci.yml).
      - name: Raise the inotify instance limit
        run: sudo sysctl -w fs.inotify.max_user_instances=8192

      # Docker Hub rate-limits anonymous pulls per IP, which the runners
      # share: take the Docker Hub images the tests run from Google's
      # mirror, as CI does. A commit from before tools/images names the
      # mesh's CoreDNS in a constant.
      - name: Pull the tests' Docker Hub images from mirror.gcr.io
        run: |
          if [[ -d tools/images ]]; then
            images=$(go run ./tools/images)
          else
            images=$(sed -n 's/^const DNSImage = "\(.*\)"$/\1/p' pkg/mesh/mesh.go)
          fi
          # shellcheck disable=SC2086 # one word per image
          for image in $images busybox:latest; do
            case "$image" in
              */*) path=$image ;;
              *) path=library/$image ;;
            esac
            docker pull "mirror.gcr.io/$path"
            docker tag "mirror.gcr.io/$path" "$image"
          done

      # go test passes when -run selects no test, and a test of a commit
      # from before SIND_TEST_REQUIRE_DOCKER skips when it reaches no
      # daemon: fail in both cases, so that neither lets an untested image
      # through. shell: bash adds pipefail, for the status of go test.
      - name: Test the image
        shell: bash
        env:
          SIND_TEST_IMAGE: local/sind-node:ci
          SIND_TEST_REQUIRE_DOCKER: "1"
        run: |
          go test -race -tags integration -run "$TESTS" -v ./cmd/sind ./pkg/cluster | tee "$RUNNER_TEMP/tests.log"
          passed=$(grep -c '^--- PASS: ' "$RUNNER_TEMP/tests.log" || true)
          if [[ "$passed" -ne 4 ]]; then
            echo "::error::expected 4 tests to match $TESTS and pass, found $passed"
            exit 1
          fi

  merge:
    name: merge (${{ matrix.target }})
    needs: [targets, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Mint a Sigstore signing certificate and store the attestation.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        id: tag
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mapfile -t tags < <(docker buildx bake --print "$TARGET" | jq -r --arg t "$TARGET" '.target[$t].tags[]')
          # A release build must not move the tags of main.
          if [[ -n "$SIND_RELEASE" ]]; then
            for tag in "${tags[@]}"; do
              if [[ "$tag" != "$IMAGE:$SIND_RELEASE" && "$tag" != "$IMAGE:$SIND_RELEASE-"* ]]; then
                echo "::error::$tag is not a tag of release $SIND_RELEASE"
                exit 1
              fi
            done
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in "$RUNNER_TEMP/digests/$TARGET"/*; do
            args+=("$IMAGE@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          echo "digest=$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Build provenance for the multi-platform image, stored in the
      # registry next to it: gh attestation verify checks that this
      # workflow built it.
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
