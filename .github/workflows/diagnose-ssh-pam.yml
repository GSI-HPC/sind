# One-off diagnosis: sind ssh is refused by PAM on nodes with extra privileges.
# Not meant to be merged.
name: Diagnose sind ssh PAM denial

on:
  push:
    branches: [claude/verify-cvmfs-37]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write cluster config
        run: |
          cat > diag-cluster.yml <<'CFG'
          kind: Cluster
          name: diag
          nodes:
            - role: controller
            - role: worker                          # worker-0: no extra privileges
            - role: worker                          # worker-1: /dev/fuse only
              devices: [/dev/fuse]
            - role: worker                          # worker-2: apparmor=unconfined only
              securityOpt: [apparmor=unconfined]
            - role: worker                          # worker-3: SYS_ADMIN + apparmor=unconfined
              capAdd: [SYS_ADMIN]
              securityOpt: [apparmor=unconfined]
          CFG
          cat diag-cluster.yml

      - uses: GSI-HPC/sind-action@v2
        with:
          clusters: |
            - diag-cluster.yml

      - name: sind ssh per node
        run: |
          for n in controller worker-0 worker-1 worker-2 worker-3; do
            if timeout 30 sind ssh "$n.diag" -- true 2>/dev/null; then echo "ssh $n: OK"; else echo "ssh $n: DENIED"; fi
          done

      - name: pam_unix account internals (worker-0 allowed, worker-2 denied)
        run: |
          for short in worker-0 worker-2; do
            node="sind-diag-$short"
            echo "===== $short"
            docker exec "$node" bash -c '
              sed -i -E "s/^(account\s+required\s+pam_unix\.so)\s*$/\1 debug/" /etc/pam.d/password-auth
              grep -E "^account" /etc/pam.d/password-auth
              ls -l /usr/sbin/unix_chkpwd
              /usr/sbin/unix_chkpwd root chkexpiry </dev/null; echo "unix_chkpwd root chkexpiry: rc=$?"
              getent shadow root >/dev/null && echo "getent shadow root: OK" || echo "getent shadow root: FAILED"
              dnf -y -q install libselinux-utils >/dev/null 2>&1
              selinuxenabled; echo "selinuxenabled: rc=$? (0 = enabled)"
              echo "getenforce: $(getenforce 2>&1)"
              echo "/proc/self/attr/current: $(cat /proc/self/attr/current)"
              grep -E "selinuxfs|securityfs" /proc/mounts || echo "no selinuxfs/securityfs mounts"
            ' || true
            since=$(docker exec "$node" date +%s)
            timeout 30 sind ssh "$short.diag" -- true 2>/dev/null && r=OK || r=DENIED
            echo "sind ssh: $r"
            docker exec "$node" journalctl --no-pager --since "@$since" | grep -Ei 'pam_unix|unix_chkpwd|chkpwd|selinux' | sed 's/^.*\]: //' | head -15
          done

      - uses: GSI-HPC/sind-action/cleanup@v2
        if: always()
