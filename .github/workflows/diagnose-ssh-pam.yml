# One-off diagnosis: sind ssh is refused by PAM on nodes with extra privileges.
# Not meant to be merged.
name: Diagnose sind ssh PAM denial

on:
  push:
    branches: [claude/verify-cvmfs-37]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write cluster config
        run: |
          cat > diag-cluster.yml <<'CFG'
          kind: Cluster
          name: diag
          nodes:
            - role: controller
            - role: worker                          # worker-0: no extra privileges
            - role: worker                          # worker-1: /dev/fuse only
              devices: [/dev/fuse]
            - role: worker                          # worker-2: apparmor=unconfined only
              securityOpt: [apparmor=unconfined]
            - role: worker                          # worker-3: SYS_ADMIN + apparmor=unconfined
              capAdd: [SYS_ADMIN]
              securityOpt: [apparmor=unconfined]
          CFG
          cat diag-cluster.yml

      - uses: GSI-HPC/sind-action@v2
        with:
          clusters: |
            - diag-cluster.yml

      - name: sind ssh per node
        run: |
          for n in controller worker-0 worker-1 worker-2 worker-3; do
            if timeout 30 sind ssh "$n.diag" -- true 2>/dev/null; then echo "ssh $n: OK"; else echo "ssh $n: DENIED"; fi
          done

      - name: Host AppArmor profiles and denials during a failed login
        run: |
          echo "--- host AppArmor profiles matching chkpwd/ssh:"
          sudo aa-status 2>/dev/null | grep -iE 'chkpwd|ssh|unix' || echo "none loaded"
          find /etc/apparmor.d -maxdepth 1 \( -iname '*chkpwd*' -o -iname '*ssh*' \) -print
          echo "--- AppArmor labels of sshd processes inside the nodes:"
          for short in worker-0 worker-2; do
            docker exec "sind-diag-$short" bash -c 'ps -eo label=,comm= | grep -E "sshd" | sort -u' | sed "s/^/$short: /"
          done
          sudo dmesg --clear
          timeout 30 sind ssh worker-2.diag -- true 2>/dev/null && echo "sind ssh worker-2: OK" || echo "sind ssh worker-2: DENIED"
          docker exec sind-diag-worker-2 /usr/sbin/unix_chkpwd root chkexpiry </dev/null; echo "unix_chkpwd on worker-2: rc=$?"
          docker exec sind-diag-worker-0 /usr/sbin/unix_chkpwd root chkexpiry </dev/null; echo "unix_chkpwd on worker-0: rc=$?"
          echo "--- kernel AppArmor messages:"
          sudo dmesg | grep -i apparmor | sed -E 's/^\[[^]]*\] //' | tail -25 || true

      - uses: GSI-HPC/sind-action/cleanup@v2
        if: always()
