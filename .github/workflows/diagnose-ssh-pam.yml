# One-off diagnosis: sind ssh is refused by PAM on nodes with extra privileges.
# Not meant to be merged.
name: Diagnose sind ssh PAM denial

on:
  push:
    branches: [claude/verify-cvmfs-37]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write cluster config
        run: |
          cat > diag-cluster.yml <<'CFG'
          kind: Cluster
          name: diag
          nodes:
            - role: controller
            - role: worker                          # worker-0: no extra privileges
            - role: worker                          # worker-1: /dev/fuse only
              devices: [/dev/fuse]
            - role: worker                          # worker-2: apparmor=unconfined only
              securityOpt: [apparmor=unconfined]
            - role: worker                          # worker-3: SYS_ADMIN + apparmor=unconfined
              capAdd: [SYS_ADMIN]
              securityOpt: [apparmor=unconfined]
          CFG
          cat diag-cluster.yml

      - uses: GSI-HPC/sind-action@v2
        with:
          clusters: |
            - diag-cluster.yml

      - name: sind ssh per node
        run: |
          for n in controller worker-0 worker-1 worker-2 worker-3; do
            if timeout 30 sind ssh "$n.diag" -- true 2>/dev/null; then echo "ssh $n: OK"; else echo "ssh $n: DENIED"; fi
          done

      - name: Node state
        run: |
          for n in controller worker-0 worker-1 worker-2 worker-3; do
            echo "===== $n"
            docker exec "sind-diag-$n" bash -c '
              capeff=$(awk "/^CapEff/{print \$2}" /proc/self/status)
              (( 0x$capeff & (1 << 21) )) && echo "CAP_SYS_ADMIN: yes" || echo "CAP_SYS_ADMIN: no"
              echo "LSM profile: $(cat /proc/self/attr/current 2>/dev/null)"
              echo "system state: $(systemctl is-system-running)"
              echo "systemd-user-sessions: $(systemctl is-active systemd-user-sessions)"
              for f in /run/nologin /etc/nologin /var/run/nologin; do [[ -e $f ]] && echo "present: $f"; done
              findmnt -n /sys/fs/selinux >/dev/null && echo "selinuxfs: mounted" || echo "selinuxfs: not mounted"
              chage -l root | head -4
              journalctl -b --no-pager | grep -Ei "pam|sepermit|nologin|denied|selinux" | tail -12
            ' || true
          done

      - name: PAM configuration
        run: |
          docker exec sind-diag-worker-0 bash -c 'for f in /etc/pam.d/sshd /etc/pam.d/password-auth; do echo "--- $f"; grep -Ev "^\s*(#|$)" "$f"; done'

      - name: Bisect the PAM account stack on failing nodes
        run: |
          for short in worker-1 worker-2 worker-3; do
            node="sind-diag-$short"
            if timeout 30 sind ssh "$short.diag" -- true 2>/dev/null; then echo "===== $short: login OK, nothing to bisect"; continue; fi
            echo "===== $short: login denied, bisecting"
            orig=$(docker exec "$node" cat /etc/pam.d/sshd)
            mapfile -t rest < <(awk '$1 !~ /^-?account$/' <<<"$orig")
            acct=()
            while IFS= read -r line; do
              read -r typ ctl mod _ <<<"$line"
              [[ "$typ" =~ ^-?account$ ]] || continue
              if [[ "$ctl" == include || "$ctl" == substack ]]; then
                mapfile -t -O "${#acct[@]}" acct < <(docker exec "$node" awk '$1 ~ /^-?account$/' "/etc/pam.d/$mod")
              else
                acct+=("$line")
              fi
            done <<<"$orig"
            printf '  stack: %s\n' "${acct[@]}"
            for i in "${!acct[@]}"; do
              { printf '%s\n' "${rest[@]}"
                for j in "${!acct[@]}"; do
                  if [[ "$j" != "$i" ]]; then printf '%s\n' "${acct[$j]}"; fi
                done
              } | docker exec -i "$node" tee /etc/pam.d/sshd >/dev/null
              if timeout 30 sind ssh "$short.diag" -- true 2>/dev/null; then r="login OK"; else r="still denied"; fi
              echo "  without [${acct[$i]}]: $r"
            done
            printf '%s\n' "$orig" | docker exec -i "$node" tee /etc/pam.d/sshd >/dev/null
          done

      - uses: GSI-HPC/sind-action/cleanup@v2
        if: always()
