# One-off diagnosis: sind ssh is refused by PAM on nodes with extra privileges.
# Not meant to be merged.
name: Diagnose sind ssh PAM denial

on:
  push:
    branches: [claude/verify-cvmfs-37]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write cluster config
        run: |
          cat > diag-cluster.yml <<'CFG'
          kind: Cluster
          name: diag
          nodes:
            - role: controller
            - role: worker                          # worker-0: no extra privileges
            - role: worker                          # worker-1: /dev/fuse only
              devices: [/dev/fuse]
            - role: worker                          # worker-2: apparmor=unconfined only
              securityOpt: [apparmor=unconfined]
            - role: worker                          # worker-3: SYS_ADMIN + apparmor=unconfined
              capAdd: [SYS_ADMIN]
              securityOpt: [apparmor=unconfined]
          CFG
          cat diag-cluster.yml

      - uses: GSI-HPC/sind-action@v2
        with:
          clusters: |
            - diag-cluster.yml

      - name: sind ssh per node
        run: |
          for n in controller worker-0 worker-1 worker-2 worker-3; do
            if timeout 30 sind ssh "$n.diag" -- true 2>/dev/null; then echo "ssh $n: OK"; else echo "ssh $n: DENIED"; fi
          done

      - name: sshd debug log of a denied and an allowed login
        run: |
          for short in worker-0 worker-2; do
            node="sind-diag-$short"
            docker exec "$node" bash -c 'echo "LogLevel DEBUG3" > /etc/ssh/sshd_config.d/00-debug.conf && systemctl reload sshd && sleep 1'
            since=$(docker exec "$node" date +%s)
            timeout 30 sind ssh "$short.diag" -- true 2>/dev/null && r=OK || r=DENIED
            echo "===== $short: $r"
            docker exec "$node" journalctl --no-pager -u sshd --since "@$since" | grep -Ei 'pam|account|fatal' | sed 's/^.*sshd-session/sshd-session/' | head -25
          done

      - name: PAM account module subsets on worker-2
        run: |
          node=sind-diag-worker-2
          orig=$(docker exec "$node" cat /etc/pam.d/sshd)
          mapfile -t rest < <(awk '$1 !~ /^-?account$/' <<<"$orig")
          mods=(pam_sepermit.so pam_nologin.so pam_unix.so)
          for mask in 0 1 2 3 4 5 6 7; do
            kept=()
            for b in 0 1 2; do if (( mask & (1 << b) )); then kept+=("${mods[$b]}"); fi; done
            { printf '%s\n' "${rest[@]}"
              for m in "${kept[@]}"; do echo "account required $m"; done
              echo "account required pam_permit.so"
            } | docker exec -i "$node" tee /etc/pam.d/sshd >/dev/null
            if timeout 30 sind ssh worker-2.diag -- true 2>/dev/null; then r="login OK"; else r="denied"; fi
            echo "account stack [${kept[*]:-} pam_permit.so]: $r"
          done
          printf '%s\n' "$orig" | docker exec -i "$node" tee /etc/pam.d/sshd >/dev/null

      - name: Environment differences (worker-0 vs worker-2)
        run: |
          for short in worker-0 worker-2; do
            echo "===== $short"
            docker exec "sind-diag-$short" bash -c '
              echo "sepermit.conf: $(grep -Ev "^\s*(#|$)" /etc/security/sepermit.conf | tr "\n" " ")"
              echo "pid1 LSM: $(cat /proc/1/attr/current 2>/dev/null)"
              echo "loginuid: $(cat /proc/self/loginuid)"
              ls -la /etc/shadow
            '
          done

      - uses: GSI-HPC/sind-action/cleanup@v2
        if: always()
