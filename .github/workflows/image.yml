name: Image

# Publishes the sind-node images (docker-bake.hcl) to ghcr.io/gsi-hpc/sind-node:
# - a push to main that changes the image build publishes <version>,
#   <YY>.<MM> and latest, which development builds of sind use by default
# - a release tag vX.Y.Z publishes vX.Y.Z-<YY>.<MM> and vX.Y.Z, which the
#   release's binaries use by default (.goreleaser.yaml); GitHub does not
#   apply path filters to tag pushes
# Nothing else publishes: a run on any other ref fails.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-bake.hcl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Plan the builds
        id: plan
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) release="" ;;
            refs/tags/v*) release="$GITHUB_REF_NAME" ;;
            *)
              echo "::error::Images are published from main and release tags only, not from $GITHUB_REF"
              exit 1
              ;;
          esac
          jq -cnr --arg ref "$GITHUB_SHA" --arg release "$release" \
            '"builds=\([{ref: $ref, release: $release}] | tojson)"' >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.release || 'main' }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      ref: ${{ matrix.ref }}
      release: ${{ matrix.release }}
