name: Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-bake.hcl"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # One bake target per Slurm release line (SLURM_RELEASES in
      # docker-bake.hcl). The bake file also sets the tags, including
      # latest on the newest release line.
      - name: List node image targets
        id: targets
        uses: docker/bake-action/subaction/matrix@v7

  build:
    name: build (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          allow: network.host
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
