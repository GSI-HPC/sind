name: Image

# Publishes the sind-node images (docker-bake.hcl) to ghcr.io/gsi-hpc/sind-node:
# - a push to main that changes the image build publishes <version>,
#   <YY>.<MM> and latest, which development builds of sind use by default
# - a release tag vX.Y.Z publishes vX.Y.Z-<YY>.<MM> and vX.Y.Z, which the
#   release's binaries use by default (.goreleaser.yaml); GitHub does not
#   apply path filters to tag pushes
# - the weekly schedule, or a manual run on main, rebuilds both the images
#   of main and those of the newest release with the current Rocky Linux
#   packages; a manual run on a release tag rebuilds that release's images
# Nothing else publishes: a run on any other ref fails.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-bake.hcl"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      # Each build is {ref, release, refresh}; refresh rebuilds the runtime
      # stage without the cache, so its packages are current.
      - name: Plan the builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refresh=false
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            refresh=true
          fi
          build() {
            jq -cn --arg ref "$1" --arg release "$2" --argjson refresh "$refresh" \
              '{ref: $ref, release: $release, refresh: $refresh}'
          }
          case "$GITHUB_REF" in
            refs/heads/main)
              builds=("$(build "$GITHUB_SHA" "")")
              # A rebuild of main also rebuilds the newest release's images,
              # which its binaries use, unless the release predates them.
              if [[ "$refresh" == true ]]; then
                tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || tag=""
                if [[ -n "$tag" ]]; then
                  config=$(gh api "repos/$GITHUB_REPOSITORY/contents/.goreleaser.yaml?ref=$tag" --jq .content | base64 -d) || config=""
                  if grep -q 'pkg/config\.DefaultImage=' <<<"$config"; then
                    builds+=("$(build "$tag" "$tag")")
                  else
                    echo "::notice::Release $tag predates release images and is not rebuilt"
                  fi
                fi
              fi
              ;;
            refs/tags/v*)
              builds=("$(build "$GITHUB_SHA" "$GITHUB_REF_NAME")")
              ;;
            *)
              echo "::error::Images are published from main and release tags only, not from $GITHUB_REF"
              exit 1
              ;;
          esac
          echo "builds=$(jq -cs . <<<"${builds[*]}")" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.release || 'main' }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      ref: ${{ matrix.ref }}
      release: ${{ matrix.release }}
      refresh: ${{ matrix.refresh }}
