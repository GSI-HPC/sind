name: Deploy docs

# Builds the release docs (main, at /) and the preview docs (next, at /next/)
# together and deploys them as one Pages artifact, so no gh-pages branch
# accumulates history. Video episodes (video/README.md) are rendered here into
# each checkout's docs/ before Hugo runs, by the avatars library's render
# action: renders are cached per render hash, in the cache scope of the branch
# that ran, so a run on next renders only new or changed episodes.

on:
  push:
    branches: [main, next]
    paths:
      - docs/**
      - video/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out next
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          path: next
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the video toolchain of main
        if: hashFiles('main/video/avatars.json') != ''
        run: npm ci --no-audit --no-fund --prefix main/video

      - name: Render the episodes of main
        if: hashFiles('main/video/avatars.json') != ''
        uses: dennisklein/avatars/integrations/github/render@26f196a28c8df28675ae2fe92cbfad1b0e33efb4 # v0.1.0
        with:
          project: main/video
          store: .avatars-store-main
          cache-key-prefix: sind-videos-main

      - name: Install the video toolchain of next
        if: hashFiles('next/video/avatars.json') != ''
        run: npm ci --no-audit --no-fund --prefix next/video

      - name: Render the episodes of next
        if: hashFiles('next/video/avatars.json') != ''
        uses: dennisklein/avatars/integrations/github/render@26f196a28c8df28675ae2fe92cbfad1b0e33efb4 # v0.1.0
        with:
          project: next/video
          store: .avatars-store-next
          cache-key-prefix: sind-videos-next

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.167.0"

      # Pinned to a release and its checksum: the theme renders every page,
      # and a new release must not reach the site without a commit.
      - name: Install theme
        env:
          GEEKDOC_VERSION: v4.1.3
          GEEKDOC_SHA256: 325d3960e568cb623ee47b498f70ae2da851c6b377b4c6723d5f73dfe24e9d21
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo-geekdoc.tar.gz" \
            "https://github.com/thegeeklab/hugo-geekdoc/releases/download/$GEEKDOC_VERSION/hugo-geekdoc.tar.gz"
          echo "$GEEKDOC_SHA256  $RUNNER_TEMP/hugo-geekdoc.tar.gz" | sha256sum --check -
          mkdir -p themes/hugo-geekdoc
          tar -xzf "$RUNNER_TEMP/hugo-geekdoc.tar.gz" -C themes/hugo-geekdoc/

      - name: Build
        run: |
          hugo --source main/docs --themesDir "$GITHUB_WORKSPACE/themes" \
            --baseURL "https://gsi-hpc.github.io/sind/" --destination "$GITHUB_WORKSPACE/site"
          hugo --source next/docs --themesDir "$GITHUB_WORKSPACE/themes" \
            --baseURL "https://gsi-hpc.github.io/sind/next/" --destination "$GITHUB_WORKSPACE/site/next"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
