version: 2
# cooldown: a version update waits until the release is 7 days old, so that
# a release that its registry takes back in its first days is not proposed.
# Security updates do not wait.
updates:
  # The Hextra theme in docs/go.mod is left out: Dependabot runs
  # `go mod tidy`, which drops the requirement of a Hugo module, as no Go
  # code imports it. Bump it by hand (.claude/skills/steward).
  - package-ecosystem: gomod
    directories:
      - /
      - /tools/screenshots
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /video
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /video/voice
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
