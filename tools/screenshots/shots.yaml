# The screenshots of sind ui for the docs. tools/screenshots takes them from
# sind ui --demo --still, once per shot, theme (light and dark) and size, into
# NAME-light.png, NAME-dark.png and, for the size phone, NAME-phone-light.png
# and NAME-phone-dark.png. The images are not committed: change this list, the
# UI or the demo, and run
#
#   go build -o sind ../../cmd/sind && go run . -sind ./sind -out /tmp/shots
#
# Fields: name; alt, the text that stands for the image; path, the page to
# open; steps, run on it first (click SELECTOR, dialog ACTION[?QUERY], wait
# SELECTOR, type TEXT into SELECTOR); crop, the selector of the element to
# take instead of the window; hide, the selector of what to hide, such as the
# task dock; fit, to shorten the window to a short page;
# sizes, default desktop; page, the page of the UI that the shot shows. The docs
# show a shot by its name with the shortcode uishot; the docs workflow takes them.
sizes:
  desktop: {width: 1440, height: 900}
  phone: {width: 390, height: 844}
shots:
  - name: overview
    alt: "Overview: what needs you first, with the problems named in the head, then the realms, a card for each cluster and the latest runs"
    path: /
    page: overview
    sizes: [desktop, phone]

  - name: clusters
    alt: "Clusters: one row for each cluster of every realm, with its state, nodes and Slurm version"
    path: /clusters
    hide: "#tasks"
    page: clusters
    fit: true
    sizes: [desktop, phone]

  - name: cluster
    alt: "A cluster: its state, its nodes by role, the services that are down and what you can do with it"
    path: /clusters/sind/dev
    hide: "#tasks"
    page: cluster
    sizes: [desktop, phone]

  - name: cluster-logs
    alt: "A cluster's Logs tab: the log of one node, from Docker or the journal"
    path: /clusters/sind/dev?tab=logs
    hide: "#tasks"
    page: cluster
    fit: true

  - name: cluster-network
    alt: "A cluster's Network and storage tab: its networks, and the volumes and mounts of its nodes"
    path: /clusters/sind/dev?tab=network
    hide: "#tasks"
    page: cluster
    fit: true

  - name: cluster-connect
    alt: "A cluster's Connect tab: the commands that open a shell, run a command, log in to a node or follow its log"
    path: /clusters/sind/dev?tab=connect
    hide: "#tasks"
    page: cluster
    fit: true

  - name: nodes
    alt: "Nodes: every node of the realm, and which of them need you"
    path: /nodes
    hide: "#tasks"
    page: nodes

  - name: node
    alt: "A node whose slurmd is down: its identity, services and the commands for it"
    path: /nodes/sind/dev/worker-4
    hide: "#tasks"
    page: node
    fit: true

  - name: mesh
    alt: "Mesh and DNS: the mesh network, the DNS and SSH containers, the records and the containers that are connected"
    path: /mesh
    hide: "#tasks"
    page: mesh

  - name: monitoring
    alt: "Monitoring: Grafana, Prometheus, Loki and Alloy of a realm, and the clusters they collect"
    path: /monitoring
    hide: "#tasks"
    page: monitoring
    fit: true

  - name: topology
    alt: "Topology: the realm's mesh, clusters and nodes as a diagram"
    path: /topology
    hide: "#tasks"
    page: topology

  - name: doctor
    alt: "Doctor: the host checks, with one warning and what to run to fix it"
    path: /doctor
    hide: "#tasks"
    page: doctor
    fit: true

  - name: activity
    alt: "Activity: the runs of sind commands, from this UI and from a terminal"
    path: /activity
    hide: "#tasks"
    page: activity

  - name: run-failed
    alt: "A run that failed: a node ran out of time, sind rolled back, and the page says what to try"
    path: /runs/d3e0000000000005
    hide: "#tasks"
    page: run

  - name: run-canceled
    alt: "A run that was stopped with Ctrl-C: the work that had not ended was stopped and rolled back"
    path: /runs/d3e0000000000006
    hide: "#tasks"
    page: run

  - name: run-going
    alt: "A run that goes on: the steps so far, the nodes that wait for their services and how much of the wait limit they used"
    path: /runs/d3e0000000000063
    hide: "#tasks"
    page: run
    sizes: [desktop, phone]

  - name: dialog-create-cluster
    alt: "The New cluster dialog: the form with the nodes and sizes, and the plan with the command and config that sind ui will run"
    path: /clusters
    steps:
      - dialog: create-cluster
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: dialog-power
    alt: "The Power dialog: Drain and Resume, the container actions and those that can lose data, and the command it runs"
    path: /clusters/sind/dev
    steps:
      - dialog: power?realm=sind&cluster=dev&op=reboot&nodes=worker-0
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: dialog-delete-cluster
    alt: "The Delete cluster dialog: what goes, what stays, and the name of the cluster to type to confirm"
    path: /clusters
    steps:
      - dialog: delete-cluster?realm=sind&cluster=legacy
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: help
    alt: "The help pane: what the page shows, the words on it and how to do the common things"
    path: /clusters/sind/dev
    hide: "#tasks"
    steps:
      - click: "[data-help-toggle]"
      - wait: "#helppane #help-body > *"
    page: help
    sizes: [desktop, phone]

  # The shots of the docs' steps for the web UI (shortcode uishot).
  - name: dialog-create-worker
    alt: "The Add workers dialog: how many workers, their size and names, and the command it runs"
    path: /clusters/sind/dev
    steps:
      - dialog: create-worker?realm=sind&cluster=dev
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: cluster-nodes-selected
    alt: "A cluster's Nodes tab with three workers selected, and what you can do with them"
    path: /clusters/sind/dev?tab=nodes
    hide: "#tasks"
    steps:
      - click: 'input[data-pg-sel="worker-2"]'
      - click: 'input[data-pg-sel="worker-3"]'
      - click: 'input[data-pg-sel="worker-4"]'
    page: cluster
    fit: true

  - name: dialog-delete-worker
    alt: "The Delete workers dialog for three workers: what goes, what stays, and the name of the cluster to type to confirm"
    path: /clusters/sind/dev?tab=nodes
    steps:
      - dialog: delete-worker?realm=sind&cluster=dev&nodes=worker-2,worker-3,worker-4
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: dialog-connect
    alt: "The Connect a container dialog: the container to connect to the realm's mesh, and the command it runs"
    path: /mesh
    steps:
      - dialog: connect?realm=sind&container=kind-control-plane
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: dialog-delete-realm
    alt: "The Delete realm dialog: the clusters and the rest that goes, what stays, and the name of the realm to type to confirm"
    path: /mesh
    steps:
      - dialog: delete-realm?realm=sind
    crop: "#layer [role=dialog]"
    page: dialogs

  - name: task-dock
    alt: "The task dock: a card for a run that goes on, with its steps, the current step, Stop and Show progress"
    path: /
    crop: "#tasks .task"
    page: run
