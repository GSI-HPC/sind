\* A create that adds the known_hosts entries and the DNS records at once
\* can fail, or be killed, with the entries written and no record.  A
\* rollback or a delete that then fails to remove the entries warns, and
\* the next delete finds no record and reports success.
\* expect: CleanAfterSuccess is violated
CONSTANTS Nodes = {n1, n2}
          MaxRuns = 3
          MaxCreates = 2
          Traces = TRUE
          KnownFirst = TRUE
          JournalLast = TRUE
          DNSFirst = FALSE
INIT CInit
NEXT CNext
INVARIANT CleanAfterSuccess
