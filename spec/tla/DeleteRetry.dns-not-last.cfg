\* DNS records that can go before the known_hosts entries: nothing then
\* tells the next run that entries are left.
\* expect: CleanAfterSuccess is violated
CONSTANTS Nodes = {n1, n2}
          MaxRuns = 3
          Traces = TRUE
          KnownFirst = FALSE
          JournalLast = TRUE
SPECIFICATION Spec
INVARIANT CleanAfterSuccess
