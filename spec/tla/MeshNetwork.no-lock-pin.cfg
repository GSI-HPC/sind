\* Why a create needs the realm lock: a client without it can read the
\* network before another client pins it, and then creates the DNS
\* container at an address that is not the pinned one.
\* expect: PinnedDNS is violated
CONSTANTS Procs = {"a", "b", "c"}
          Locked = FALSE
          ExistsIsCreated = FALSE
          MaxId = 5
SPECIFICATION Spec
INVARIANT PinnedDNS
