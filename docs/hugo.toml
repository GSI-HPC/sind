baseURL = "https://gsi-hpc.github.io/sind/"
title = "sind"
enableGitInfo = true
enableRobotsTXT = true
disablePathToLower = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/introduction"
    weight = 1
  [[menu.main]]
    name = "Guides"
    pageRef = "/guides"
    weight = 2
  [[menu.main]]
    name = "Releases"
    url = "https://github.com/GSI-HPC/sind/releases"
    weight = 3
  [[menu.main]]
    name = "Go Reference"
    url = "https://pkg.go.dev/github.com/GSI-HPC/sind"
    weight = 4
  [[menu.main]]
    name = "Search"
    weight = 5
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/GSI-HPC/sind"
    weight = 6
    [menu.main.params]
      icon = "github"

[params]
  description = "sind — create and manage containerized Slurm clusters for development, testing, and CI/CD workflows"
  displayUpdatedDate = true
  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "wide"
    [params.navbar.logo]
      path = "images/sind-icon-only.svg"
      width = 28
      height = 28
  [params.page]
    width = "wide"
  [params.theme]
    default = "system"
    displayToggle = true
  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
    width = "wide"

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      # Vendored, so the build fetches nothing from a CDN.
      js = "vendor/flexsearch.bundle.min.js"
  [params.editURL]
    enable = true
    base = "https://github.com/GSI-HPC/sind/edit/next/docs/content"
